<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Câu Cá Pixel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=VT323&display=swap">
<style>
[hidden] { display: none !important; }
/* Bố cục: thanh tab trên cùng, khung chơi 16:9 ở giữa, bảng điều khiển bên dưới. Tông màu: gỗ ván cầu và nước ao. */
:root {
  --bg: #e7eee6; --panel: #fbf8ee; --panel2: #efe9d6; --ink: #1b2a33; --muted: #5a6b72; --line: #c8cdb6;
  --accent: #d3522a; --accent-ink: #ffffff; --teal: #137a8a; --good: #2a8a52; --bad: #c63c34; --gold: #a9780f;
  --shadow: rgba(27, 42, 51, .18); --stage-edge: #1b2a33; --track: #d9dcc8;
  --font-display: 'VT323', ui-monospace, 'Courier New', monospace;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1620; --panel: #14212d; --panel2: #1a2b3a; --ink: #e3edf0; --muted: #94a6ad; --line: #2a3d4d;
    --accent: #ff7f50; --accent-ink: #1b1209; --teal: #4cc3d4; --good: #4cc27d; --bad: #ff6b61; --gold: #e3b341;
    --shadow: rgba(0, 0, 0, .45); --stage-edge: #02070c; --track: #22364a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1620; --panel: #14212d; --panel2: #1a2b3a; --ink: #e3edf0; --muted: #94a6ad; --line: #2a3d4d;
  --accent: #ff7f50; --accent-ink: #1b1209; --teal: #4cc3d4; --good: #4cc27d; --bad: #ff6b61; --gold: #e3b341;
  --shadow: rgba(0, 0, 0, .45); --stage-edge: #02070c; --track: #22364a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .drop:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
h2 { font-size: 28px; } h3 { font-size: 22px; }
p { margin: 0; }
.app { max-width: 1040px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: 38px; line-height: 1; letter-spacing: .03em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--font-display); font-size: 22px; line-height: 1; padding: 6px 10px; background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--shadow); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px 0 14px; padding-bottom: 4px; scrollbar-width: thin; }
.tab { flex: none; font-family: var(--font-display); font-size: 22px; line-height: 1; padding: 8px 14px; background: var(--panel2); border: 2px solid var(--line); color: var(--muted); }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.view { display: none; }
.view.on { display: block; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #1c4546; border: 3px solid var(--stage-edge); box-shadow: 0 5px 0 var(--shadow); user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud-top { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.hud-top span { font-family: var(--font-display); font-size: 20px; line-height: 1; padding: 4px 8px; background: rgba(8, 16, 24, .72); color: #f1f6f4; }
.meter { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(70%, 420px); height: 22px; background: rgba(8, 16, 24, .8); border: 2px solid #f1f6f4; pointer-events: none; }
.meter-fill { height: 100%; width: 0; background: linear-gradient(90deg, #3fd18a, #ffd23f 60%, #ff5a4a); }
.meter-max { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #fff; }
.meter-lbl { position: absolute; left: 0; right: 0; top: -22px; text-align: center; font-family: var(--font-display); font-size: 18px; color: #f1f6f4; text-shadow: 0 1px 0 #000; }
.fhud { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(78%, 520px); pointer-events: none; }
.fname { font-family: var(--font-display); font-size: 20px; color: #f1f6f4; text-shadow: 0 1px 0 #000; text-align: center; line-height: 1; margin-bottom: 4px; }
.tbar { position: relative; height: 20px; background: rgba(8, 16, 24, .82); border: 2px solid #f1f6f4; }
.tbar .z { position: absolute; top: 0; bottom: 0; }
.z.slack { left: 0; width: 15%; background: repeating-linear-gradient(45deg, #5a7a9a 0 4px, #3d556e 4px 8px); }
.z.sweet { left: 32%; width: 40%; background: #2a8a52; }
.z.danger { left: 90%; width: 10%; background: repeating-linear-gradient(45deg, #e04a3a 0 4px, #8f2a22 4px 8px); }
.tmark { position: absolute; top: -4px; bottom: -4px; width: 5px; margin-left: -2px; background: #fff; box-shadow: 0 0 0 1px #000; }
.pbar { height: 8px; margin-top: 4px; background: rgba(8, 16, 24, .82); border: 2px solid #f1f6f4; }
.pfill { height: 100%; width: 0; background: #ffd23f; }
.fphase { text-align: center; font-family: var(--font-display); font-size: 20px; line-height: 1; margin-bottom: 4px; color: #cfe3ea; text-shadow: 0 1px 0 #000; }
.fhud[data-ph="warn"] .fphase { color: #ffd23f; } .fhud[data-ph="dash"] .fphase { color: #ff6a58; } .fhud[data-ph="tired"] .fphase { color: #7dffa8; }
.fhud[data-ph="tired"] .pfill { background: #7dffa8; }
.sbar { height: 6px; margin-top: 3px; background: rgba(8, 16, 24, .82); border: 2px solid #f1f6f4; }
.sfill { height: 100%; width: 100%; background: #58c8ff; transition: width .1s linear; }
.arow { display: grid; grid-template-columns: 1fr 140px; gap: 10px; align-items: center; margin: 10px 0; font-size: 14px; }
.arow input { width: 100%; }
.toast { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); max-width: 86%; text-align: center; font-family: var(--font-display); font-size: 24px; line-height: 1.1; padding: 6px 12px; background: rgba(8, 16, 24, .86); color: #f1f6f4; border: 2px solid #f1f6f4; pointer-events: none; }
.toast.good { border-color: #6be39a; color: #c9ffe0; } .toast.bad { border-color: #ff8a7a; color: #ffd6d0; }
.hintline { margin: 10px 2px 0; min-height: 22px; color: var(--muted); font-size: 14px; }
.controls { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 12px; margin-top: 10px; align-items: stretch; }
.act { font-family: var(--font-display); font-size: 28px; line-height: 1; padding: 16px 10px; background: var(--accent); color: var(--accent-ink); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.act:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.act[disabled] { opacity: .55; }
.act.hot { background: #e03a2a; color: #fff; }
.side { display: grid; gap: 10px; min-width: 0; }
.skills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sk { position: relative; overflow: hidden; text-align: left; padding: 6px 8px; background: var(--panel); border: 2px solid var(--ink); min-width: 0; }
.sk b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk small { display: block; color: var(--muted); font-size: 11px; }
.sk .cd { position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: var(--shadow); pointer-events: none; }
.sk.lock { opacity: .55; } .sk.live { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal); }
.gear { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.gear label { display: flex; gap: 6px; align-items: center; }
.gear select { padding: 5px 8px; background: var(--panel); border: 2px solid var(--ink); }
.panel { background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--shadow); padding: 14px; }
.panel + .panel, .stack > * + * { margin-top: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { background: var(--panel); border: 2px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.on { border-color: var(--teal); }
.card.lockd { opacity: .6; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.btn { font-family: var(--font-display); font-size: 20px; line-height: 1; padding: 8px 12px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--good); color: #fff; }
.btn.ghost { box-shadow: none; background: transparent; }
.btn[disabled] { opacity: .45; box-shadow: none; cursor: not-allowed; }
.stat { display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar { height: 8px; background: var(--track); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--teal); }
.bar.xp i { background: var(--gold); }
.tag { display: inline-block; font-family: var(--font-display); font-size: 17px; line-height: 1; padding: 3px 6px; border: 2px solid currentColor; }
.th { image-rendering: pixelated; image-rendering: crisp-edges; height: 48px; width: auto; max-width: 96px; object-fit: contain; flex: none; background: #2c6e78; border: 2px solid var(--ink); padding: 3px; }
.th.silh { filter: brightness(0); opacity: .4; }
.list { display: grid; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; padding: 8px; background: var(--panel); border: 2px solid var(--line); min-width: 0; }
.item .grow { flex: 1; min-width: 0; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(5, 12, 18, .72); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.mbox { width: min(100%, 440px); max-height: 100%; overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--shadow); padding: 18px; display: grid; gap: 10px; }
.mbox h2 { font-size: 32px; line-height: 1; }
.mbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
.cwrap { display: flex; justify-content: center; padding: 14px; background: #2c6e78; border: 2px solid var(--ink); }
.cwrap canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; height: auto; }
.badge { font-family: var(--font-display); font-size: 18px; line-height: 1; padding: 3px 7px; color: #fff; background: var(--rc, #888); }
.badge.new { background: var(--accent); }
.gain { margin: 0; padding-left: 18px; font-size: 14px; }
.story { font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
kbd { font-family: var(--font-display); font-size: 17px; padding: 0 6px; border: 2px solid var(--line); background: var(--panel2); }

/* Admin */
.adm { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: start; }
.flist { display: grid; gap: 6px; max-height: 70vh; overflow-y: auto; padding-right: 2px; }
.frow { display: flex; gap: 8px; align-items: center; text-align: left; padding: 6px; background: var(--panel); border: 2px solid var(--line); width: 100%; min-width: 0; }
.frow.on { border-color: var(--teal); background: var(--panel2); }
.frow .nm { flex: 1; min-width: 0; line-height: 1.25; }
.frow .nm b { display: block; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .th { height: 32px; max-width: 56px; padding: 2px; }
.drop { display: grid; place-items: center; gap: 4px; text-align: center; padding: 22px 12px; border: 3px dashed var(--line); background: var(--panel2); cursor: pointer; }
.drop.over { border-color: var(--teal); background: var(--panel); }
.drop b { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.form input[type=text], .form input[type=number], .form select, .form textarea { width: 100%; padding: 6px 8px; background: var(--panel); border: 2px solid var(--line); color: var(--ink); min-width: 0; }
.form .wide { grid-column: 1 / -1; }
.checks { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink); }
.checks label { display: flex; flex-direction: row; gap: 4px; align-items: center; color: var(--ink); font-size: 13px; }
.sliders { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.sliders label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.sliders label span { display: flex; justify-content: space-between; color: var(--ink); }
.sliders input[type=range] { width: 100%; accent-color: var(--teal); }
.prev { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pv { display: grid; gap: 4px; min-width: 0; }
.pv small { color: var(--muted); font-size: 12px; }
.pv .cvw { display: grid; place-items: center; min-height: 120px; padding: 6px; border: 2px solid var(--ink); background-color: #cfd6cc; background-image: linear-gradient(45deg, #b9c2b8 25%, transparent 25%, transparent 75%, #b9c2b8 75%), linear-gradient(45deg, #b9c2b8 25%, transparent 25%, transparent 75%, #b9c2b8 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; overflow: hidden; }
.pv canvas { max-width: 100%; height: auto; }
.pv canvas.crisp { image-rendering: pixelated; image-rendering: crisp-edges; }
.pv canvas.pick { cursor: crosshair; } .pv canvas.brush { cursor: cell; }
.swatch { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--ink); vertical-align: -3px; }
.note { padding: 8px 10px; background: var(--panel2); border-left: 4px solid var(--teal); font-size: 13px; }
.note.warn { border-left-color: var(--gold); }
.exp { width: 100%; min-height: 110px; font-family: ui-monospace, monospace; font-size: 11px; padding: 6px; background: var(--panel2); border: 2px solid var(--line); color: var(--ink); }
@media (max-width: 760px) {
  .adm { grid-template-columns: minmax(0, 1fr); } .flist { max-height: 260px; }
  .controls { grid-template-columns: minmax(0, 1fr); }
  .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .logo { font-size: 32px; } .toast { font-size: 20px; } .act { font-size: 26px; padding: 14px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <h1 class="logo">Câu Cá Pixel</h1>
    <div class="chips">
      <span class="chip" id="cMoney">0 xu</span>
      <span class="chip" id="cLevel">Cấp 1</span>
      <button class="btn" type="button" data-act="audio">Âm thanh</button>
      <button class="btn" id="helpBtn" type="button">Cách chơi</button>
    </div>
  </header>
  <nav class="tabs" id="nav" aria-label="Chuyển màn hình">
    <button class="tab on" type="button" data-view="play">Chơi</button>
    <button class="tab" type="button" data-view="shop">Cửa hàng</button>
    <button class="tab" type="button" data-view="bag">Túi và sổ cá</button>
    <button class="tab" type="button" data-view="skills">Kỹ năng</button>
    <button class="tab" type="button" data-view="map">Bản đồ</button>
    <button class="tab" type="button" data-view="admin">Admin</button>
  </nav>
  <main>
    <section class="view on" id="v-play">
      <div class="stage" id="stage">
        <canvas id="cv" width="480" height="270" aria-label="Khung chơi câu cá"></canvas>
        <div class="hud-top"><span id="hLake"></span><span id="hTime"></span></div>
        <div class="meter" id="meter" hidden><div class="meter-lbl">Lực quăng</div><div class="meter-fill" id="meterFill"></div><div class="meter-max" id="meterMax"></div></div>
        <div class="fhud" id="fhud" hidden>
          <div class="fname" id="fName">???</div>
          <div class="fphase" id="fPhase"></div>
          <div class="tbar"><div class="z slack"></div><div class="z sweet"></div><div class="z danger"></div><div class="tmark" id="tMark"></div></div>
          <div class="pbar"><div class="pfill" id="pFill"></div></div>
          <div class="sbar" title="Sức của cá"><div class="sfill" id="sFill"></div></div>
        </div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <p class="hintline" id="hint"></p>
      <div class="controls">
        <button class="act" id="act" type="button">QUĂNG CẦN</button>
        <div class="side">
          <div class="skills" id="skillBar"></div>
          <div class="gear">
            <span>Cần: <b id="gRod"></b></span>
            <label>Mồi <select id="baitSel" aria-label="Chọn mồi"></select></label>
          </div>
        </div>
      </div>
    </section>
    <section class="view" id="v-shop"></section>
    <section class="view" id="v-bag"></section>
    <section class="view" id="v-skills"></section>
    <section class="view" id="v-map"></section>
    <section class="view" id="v-admin"></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
(function(){
"use strict";
/* ===== DỮ LIỆU GAME: chỉnh số ở đây để cân bằng ===== */
const CFG = {
  startMoney: 30,
  clockSpeed: 4,          // phút trong game mỗi giây thật
  hookBase: 0.65,         // giây được phép dựng cần
  reelStrain: 0.40,       // lực căng thêm khi giữ cuộn
  releaseFactor: 0.55,    // nhả cần thì chỉ chịu 55% lực cá
  snapAt: 0.9,            // căng quá mức này => bắt đầu đứt
  snapTime: 0.42,
  slackAt: 0.15,          // chùng dưới mức này => bắt đầu thoát
  slackTime: 1.6,
  sweetLo: 0.32, sweetHi: 0.72,
  lakeRare: { ao: 0.6, song: 0.8, ho: 1, bien: 1.15, hang: 1.3 }   // hồ xịn thì cá hiếm dễ ra hơn, nhưng hồ nào cũng có
};

const RARITY = [
  { name: 'Phổ biến', w: 60, col: '#8aa0a8' },
  { name: 'Ít gặp', w: 26, col: '#3fae5a' },
  { name: 'Hiếm', w: 10, col: '#3d8bd9' },
  { name: 'Quý', w: 3.5, col: '#a05cd6' },
  { name: 'Huyền thoại', w: 0.5, col: '#e0a21b' }
];

const BAIT_KINDS = { worm: 'Giun', grain: 'Cơm, ngũ cốc', insect: 'Côn trùng', shrimp: 'Tép', fish: 'Cá nhỏ', lure: 'Mồi giả', glow: 'Mồi sáng' };

const BAITS = [
  { id: 'rice', name: 'Cơm nguội', kind: 'grain', price: 2, attr: 1.0 },
  { id: 'worm', name: 'Giun đất', kind: 'worm', price: 3, attr: 1.1 },
  { id: 'cricket', name: 'Dế', kind: 'insect', price: 6, attr: 1.25 },
  { id: 'shrimp', name: 'Tép', kind: 'shrimp', price: 10, attr: 1.35 },
  { id: 'minnow', name: 'Cá nhỏ', kind: 'fish', price: 25, attr: 1.5 },
  { id: 'lure', name: 'Mồi giả', kind: 'lure', price: 60, attr: 1.7 },
  { id: 'glow', name: 'Mồi phát sáng', kind: 'glow', price: 120, attr: 2.0 }
];

const RODS = [

/* ===== XỬ LÝ ẢNH: ảnh cá thật -> cá pixel (chạy hoàn toàn trên trình duyệt) ===== */
const PIX_DEFAULT = { width: 64, colors: 16, tol: 40, erode: 2, sat: 1.15, con: 1.05, outline: true, dither: 0, head: 'auto', bgMode: 'auto' };

function cdist(r1, g1, b1, r2, g2, b2) {
  const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return Math.sqrt((2 * dr * dr + 4 * dg * dg + 3 * db * db) / 9);
}

function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh này')); };
    im.src = url;
  });
}
function dataUrlToImage(u) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Ảnh lỗi')); im.src = u; });
}
function imageToWork(im, maxDim) {
  maxDim = maxDim || 420;
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const s = Math.min(1, maxDim / Math.max(iw, ih));
  const w = Math.max(8, Math.round(iw * s)), h = Math.max(8, Math.round(ih * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingQuality = 'high';
  x.drawImage(im, 0, 0, w, h);
  return c;
}

function hasTransparency(d, w, h) {
  let n = 0; const tot = w * h;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) n++;
  return n > tot * 0.03;
}

function estimateBg(d, w, h) {
  const buckets = new Map();
  const add = (x, y) => {
    const i = (y * w + x) * 4; if (d[i + 3] < 200) return;
    const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
    let b = buckets.get(k); if (!b) { b = [0, 0, 0, 0]; buckets.set(k, b); }
    b[0] += d[i]; b[1] += d[i + 1]; b[2] += d[i + 2]; b[3]++;
  };
  for (let x = 0; x < w; x++) for (let t = 0; t < 2; t++) { add(x, t); add(x, h - 1 - t); }
  for (let y = 2; y < h - 2; y++) for (let t = 0; t < 2; t++) { add(t, y); add(w - 1 - t, y); }
  let best = null;
  for (const b of buckets.values()) if (!best || b[3] > best[3]) best = b;
  if (!best) return [255, 255, 255];
  return [best[0] / best[3], best[1] / best[3], best[2] / best[3]];
}

/* Loang từ viền vào, mọi điểm giống màu nền (hoặc đổi màu rất êm từ điểm trước) là nền. Trả về 1 = cá. */
function autoMask(d, w, h, bg, tol) {
  const n = w * h, isBg = new Uint8Array(n), q = new Int32Array(n);
  let qh = 0, qt = 0;
  const dbg = (i) => cdist(d[i * 4], d[i * 4 + 1], d[i * 4 + 2], bg[0], bg[1], bg[2]);
  const seed = (i) => { if (!isBg[i] && dbg(i) <= tol) { isBg[i] = 1; q[qt++] = i; } };
  for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1); }
  const nb = [1, -1, w, -w];
  while (qh < qt) {
    const i = q[qh++], x = i % w;
    for (let k = 0; k < 4; k++) {
      const j = i + nb[k];
      if (j < 0 || j >= n || isBg[j]) continue;
      if (k === 0 && x === w - 1) continue;
      if (k === 1 && x === 0) continue;
      const dj = dbg(j);
      let ok = dj <= tol;
      if (!ok && dj <= tol * 1.5) {
        const dp = cdist(d[i * 4], d[i * 4 + 1], d[i * 4 + 2], d[j * 4], d[j * 4 + 1], d[j * 4 + 2]);
        ok = dp <= tol * 0.14;
      }
      if (ok) { isBg[j] = 1; q[qt++] = j; }
    }
  }
  const fg = new Uint8Array(n);
  for (let i = 0; i < n; i++) fg[i] = isBg[i] ? 0 : 1;
  return fg;
}
function alphaMask(d, w, h) {
  const fg = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) fg[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  return fg;
}

function largestComponent(m, w, h) {
  const n = w * h, lab = new Int32Array(n), q = new Int32Array(n);
  let best = 0, bestSize = 0, cur = 0;
  for (let s = 0; s < n; s++) {
    if (!m[s] || lab[s]) continue;
    cur++; let qh = 0, qt = 0; q[qt++] = s; lab[s] = cur;
    while (qh < qt) {
      const i = q[qh++], x = i % w, y = (i / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const j = yy * w + xx;
        if (m[j] && !lab[j]) { lab[j] = cur; q[qt++] = j; }
      }
    }
    if (qt > bestSize) { bestSize = qt; best = cur; }
  }
  const out = new Uint8Array(n);
  if (best) for (let i = 0; i < n; i++) out[i] = lab[i] === best ? 1 : 0;
  return out;
}
function erodeMask(m, w, h, r) {
  let cur = m;
  for (let k = 0; k < r; k++) {
    const out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (!cur[i]) continue;
      if (x === 0 || y === 0 || x === w - 1 || y === h - 1) continue;
      if (cur[i - 1] && cur[i + 1] && cur[i - w] && cur[i + w]) out[i] = 1;
    }
    cur = out;
  }
  return cur;
}
function smoothMask(m, w, h) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && m[yy * w + xx]) c++;
    }
    out[y * w + x] = c >= 5 ? 1 : 0;
  }
  return out;
}
function cleanMask(fg, w, h, erode) {
  let m = largestComponent(fg, w, h);
  if (erode > 0) m = erodeMask(m, w, h, erode);
  m = smoothMask(m, w, h);
  return largestComponent(m, w, h);
}

function makeCut(srcData, w, h, mask) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  const out = x.createImageData(w, h), o = out.data, s = srcData.data;
  for (let i = 0; i < w * h; i++) {
    o[i * 4] = s[i * 4]; o[i * 4 + 1] = s[i * 4 + 1]; o[i * 4 + 2] = s[i * 4 + 2];
    o[i * 4 + 3] = mask[i] ? 255 : 0;
  }
  x.putImageData(out, 0, 0);
  return c;
}

/* Đoán đầu cá nằm bên trái: thân gần đầu dày hơn thân gần đuôi */
function guessHeadLeft(alpha, w, h, bx0, bx1) {
  const len = bx1 - bx0 + 1; if (len < 6) return true;
  const col = new Float32Array(w);
  for (let y = 0; y < h; y++) for (let x = bx0; x <= bx1; x++) if (alpha[y * w + x] > 127) col[x]++;
  const avg = (a, b) => {
    const s = bx0 + Math.floor(len * a), e = bx0 + Math.max(Math.floor(len * b), Math.floor(len * a) + 1);
    let t = 0, n = 0; for (let x = s; x < e; x++) { t += col[x]; n++; } return n ? t / n : 0;
  };
  return avg(0.1, 0.36) >= avg(0.64, 0.9);
}

function medianCut(px, k) {
  let boxes = [px];
  while (boxes.length < k) {
    let bi = -1, bestScore = 0, bch = 0;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i]; if (b.length < 2) continue;
      let mn = [255, 255, 255], mx = [0, 0, 0];
      for (const p of b) for (let c = 0; c < 3; c++) { if (p[c] < mn[c]) mn[c] = p[c]; if (p[c] > mx[c]) mx[c] = p[c]; }
      const rg = [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]];
      const ch = rg[1] >= rg[0] && rg[1] >= rg[2] ? 1 : rg[0] >= rg[2] ? 0 : 2;
      const score = rg[ch] * Math.sqrt(b.length);
      if (score > bestScore) { bestScore = score; bi = i; bch = ch; }
    }
    if (bi < 0) break;
    const b = boxes[bi].slice().sort((a, c) => a[bch] - c[bch]);
    const mid = b.length >> 1;
    boxes.splice(bi, 1, b.slice(0, mid), b.slice(mid));
  }
  return boxes.map(b => {
    const s = [0, 0, 0]; for (const p of b) { s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; }
    return [Math.round(s[0] / b.length), Math.round(s[1] / b.length), Math.round(s[2] / b.length)];
  });
}

const BAYER4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

/* cut: canvas đã tách nền (alpha). Trả về {canvas, mouthY, headWasLeft} hoặc null nếu rỗng */
function pixelize(cut, o) {
  o = Object.assign({}, PIX_DEFAULT, o || {});
  const w = cut.width, h = cut.height;
  const id = cut.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h), d = id.data;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  const alpha = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = d[(y * w + x) * 4 + 3]; alpha[y * w + x] = a;
    if (a > 127) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const headLeft = o.head === 'auto' ? guessHeadLeft(alpha, w, h, x0, x1) : o.head === 'left';
  const tw = Math.max(8, Math.round(o.width));
  const th = Math.max(6, Math.min(160, Math.round(tw * bh / bw)));

  const R = new Float32Array(tw * th), G = new Float32Array(tw * th), B = new Float32Array(tw * th), A = new Float32Array(tw * th);
  for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
    let sxa = tx * bw / tw, sxb = (tx + 1) * bw / tw;
    if (headLeft) { const t = sxa; sxa = bw - sxb; sxb = bw - t; }
    const sya = ty * bh / th, syb = (ty + 1) * bh / th;
    let r = 0, g = 0, b = 0, aS = 0, wS = 0;
    for (let y = Math.floor(sya); y < Math.ceil(syb); y++) {
      const wy = Math.min(y + 1, syb) - Math.max(y, sya); if (wy <= 0) continue;
      for (let x = Math.floor(sxa); x < Math.ceil(sxb); x++) {
        const wx = Math.min(x + 1, sxb) - Math.max(x, sxa); if (wx <= 0) continue;
        const wgt = wx * wy, i = ((y0 + y) * w + (x0 + x)) * 4, a = d[i + 3] / 255;
        wS += wgt; if (a <= 0) continue;
        r += d[i] * a * wgt; g += d[i + 1] * a * wgt; b += d[i + 2] * a * wgt; aS += a * wgt;
      }
    }
    const k = ty * tw + tx;
    if (aS > 0) { R[k] = r / aS; G[k] = g / aS; B[k] = b / aS; A[k] = aS / wS; }
  }
  /* làm đậm màu một chút cho ra chất pixel */
  const px = [], idx = [];
  for (let k = 0; k < tw * th; k++) {
    if (A[k] < 0.45) continue;
    let r = R[k], g = G[k], b = B[k];
    const l = 0.3 * r + 0.59 * g + 0.11 * b;
    r = l + (r - l) * o.sat; g = l + (g - l) * o.sat; b = l + (b - l) * o.sat;
    r = (r - 128) * o.con + 128; g = (g - 128) * o.con + 128; b = (b - 128) * o.con + 128;
    R[k] = Math.max(0, Math.min(255, r)); G[k] = Math.max(0, Math.min(255, g)); B[k] = Math.max(0, Math.min(255, b));
    px.push([R[k], G[k], B[k]]); idx.push(k);
  }
  if (!px.length) return null;
  const pal = medianCut(px, Math.max(2, Math.min(64, Math.round(o.colors))));
  const near = (r, g, b) => {
    let bi = 0, bd = 1e9;
    for (let i = 0; i < pal.length; i++) {
      const p = pal[i], dr = p[0] - r, dg = p[1] - g, db = p[2] - b, dd = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
      if (dd < bd) { bd = dd; bi = i; }
    }
    return pal[bi];
  };
  const pad = o.outline ? 1 : 0, cw = tw + pad * 2, ch = th + pad * 2;
  const out = document.createElement('canvas'); out.width = cw; out.height = ch;
  const ox = out.getContext('2d', { willReadFrequently: true });
  const oi = ox.createImageData(cw, ch), od = oi.data;
  const solid = new Uint8Array(cw * ch);
  for (const k of idx) {
    const tx = k % tw, ty = (k / tw) | 0;
    const t = o.dither ? (BAYER4[ty & 3][tx & 3] / 16 - 0.5) * o.dither * 64 : 0;
    const c = near(R[k] + t, G[k] + t, B[k] + t);
    const p = ((ty + pad) * cw + tx + pad) * 4;
    od[p] = c[0]; od[p + 1] = c[1]; od[p + 2] = c[2]; od[p + 3] = 255;
    solid[(ty + pad) * cw + tx + pad] = 1;
  }
  if (o.outline) {
    let dk = pal[0], dl = 1e9;
    for (const p of pal) { const l = p[0] + p[1] + p[2]; if (l < dl) { dl = l; dk = p; } }
    const oc = [Math.round(dk[0] * 0.45), Math.round(dk[1] * 0.45), Math.round(dk[2] * 0.45)];
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {

const DB = {
  ok: false, db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {

        rq.onupgradeneeded = () => { rq.result.createObjectStore('fish', { keyPath: 'id' }); };
        rq.onsuccess = () => { this.db = rq.result; this.ok = true; res(true); };

    });
  },
  put(rec) {
    this.mem.set(rec.id, rec);
    if (!this.ok) return Promise.resolve(false);
    return new Promise(res => {
      try { const tx = this.db.transaction('fish', 'readwrite'); tx.objectStore('fish').put(rec); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); }
    });
  },
  del(id) {
    this.mem.delete(id);
    if (!this.ok) return Promise.resolve(false);
    return new Promise(res => {
      try { const tx = this.db.transaction('fish', 'readwrite'); tx.objectStore('fish').delete(id); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); }
    });
  },
  clear() {

    return new Promise(res => {
      try { const tx = this.db.transaction('fish', 'readwrite'); tx.objectStore('fish').clear(); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); }
    });
  }
};

/* ===== GAME CÂU CÁ: trạng thái, cơ chế, vẽ ===== */

const xpNeed = l => Math.round(24 * Math.pow(l, 1.55));

const hookWindow = () => CFG.hookBase + rod().hook + 0.09 * S.pass.hands;

const G = {
  st: 'idle', t: 0, power: 0, pdir: 1, dist: 0, bx: 0, by: SURF, dip: 0, hookY: 130, wait: 0, nibbleDur: 1, bf: null, fight: null, land: null, esc: null,
  fx: [], amb: [], rain: [], motes: [], clouds: [], weather: 'nắng', wT: 70, time: 0, hold: false, shake: 0, flash: 0,

let toastT = 0;

/* ---------- chọn cá ---------- */
function fishPool(lakeId) { return FISH.filter(f => f.lake === lakeId); }
function pickFish(dist) {
  const pool = fishPool(S.lake); if (!pool.length) return null;
  const R = rod(), B = bait(), ph = phaseNow(), wx = G.weather, cave = S.lake === 'hang';
  const gearQ = Math.max(0, (B.attr - 1) * 0.55 + R.luck * 3 + 0.08 * S.pass.eye + (G.scentOn ? 0.35 : 0));
  const items = pool.map(f => {
    let w = RARITY[f.rar].w;
    const zc = { s: 0.2, m: 0.55, d: 0.9 }[f.zone] || 0.5;
    w *= 0.12 + Math.exp(-Math.pow((dist - zc) / 0.3, 2));
    const liked = (f.likes || []).includes(B.kind);
    w *= f.rar >= 2 ? (liked ? 3.2 : 0.35) : (liked ? 2.4 : 0.65);
    if (!cave && f.when) {
      if (f.when.t && f.when.t.length) w *= f.when.t.includes(ph) ? 2.2 : 0.45;
      if (f.when.w && f.when.w.length) w *= f.when.w.includes(wx) ? 2.2 : 0.6;

    if (f.rar >= 1) w *= Math.pow(0.4 + gearQ, f.rar * 0.65) * (f.rar >= 2 ? (CFG.lakeRare[S.lake] || 1) : 1);

  if (tot <= 0) return pool[0];

function rollWeight(f, dist) {

}
function baseValue(f, w) { const avg = (f.wmin + f.wmax) / 2; return Math.max(1, Math.round(f.price * Math.pow(w / avg, 0.9))); }

/* ---------- hạt hiệu ứng ---------- */
function emit(kind, x, y, n, o) {
  o = o || {};
  for (let i = 0; i < (n || 1); i++) {
    if (kind === 'drop') G.fx.push({ k: 'drop', x, y, vx: rnd(-34, 34), vy: -rnd(40, 100), life: rnd(0.5, 0.9), max: 0.9, col: o.col || '#d8f4ff' });
    else if (kind === 'bubble') G.fx.push({ k: 'bubble', x: x + rnd(-3, 3), y: y + rnd(-2, 2), vx: rnd(-4, 4), vy: -rnd(14, 30), life: rnd(0.9, 1.6), max: 1.6, col: '#cfeffb' });
    else if (kind === 'ring') G.fx.push({ k: 'ring', x, y: SURF, r: 1, life: o.life || 0.9, max: o.life || 0.9, big: o.big || 11 });
    else if (kind === 'spark') G.fx.push({ k: 'spark', x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: rnd(-20, 20), vy: -rnd(10, 40), life: rnd(0.5, 0.9), max: 0.9, col: o.col || '#ffe27a' });

}
function updateFx(dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {

    if (p.k === 'drop') { p.vy += 240 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > SURF && p.vy > 0) { p.life = 0; } }
    else if (p.k === 'bubble') { p.x += p.vx * dt; p.y += p.vy * dt; if (p.y < SURF + 1) p.life = 0; }
    else if (p.k === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; }

      const rx = p.r * 1.6, ry = Math.max(1, p.r * 0.35);

/* ---------- môi trường ---------- */

}

  const tot = pool.reduce((a, f) => a + RARITY[f.rar].w, 0);
  for (let i = 0; i < 6; i++) {

  let tot = opts.reduce((a, b) => a + b[1], 0), r = Math.random() * tot;

/* ---------- thao tác ---------- */

/* ---------- vòng cập nhật ---------- */
function updateGame(dt) {
  G.time += dt;
  S.clock += dt * CFG.clockSpeed; if (S.clock >= 1440) S.clock -= 1440;
  G.wT -= dt; if (G.wT <= 0) changeWeather();
  Object.keys(G.cool).forEach(k => { G.cool[k] = Math.max(0, G.cool[k] - dt); });
  Object.keys(G.act).forEach(k => { G.act[k] = Math.max(0, G.act[k] - dt); });
  G.shake = Math.max(0, G.shake - dt * 14);
  updateWorld(dt); updateFx(dt);
  const R = rod();
  switch (G.st) {
    case 'idle': G.rodAng = -0.75; G.rodBend = 3; break;

    case 'casting': {
      G.t += dt;
      const sw = 0.2, fl = 0.45 + 0.35 * G.dist;
      if (G.t < sw) { G.rodAng = lerp(-1.65, -0.3, G.t / sw); G.rodBend = 6; }
      else {
        G.rodAng = lerp(-0.3, -0.75, clamp((G.t - sw) / 0.4, 0, 1)); G.rodBend = 3;
        const u = clamp((G.t - sw) / fl, 0, 1);
        G.fly = { x: lerp(G.tipX, G.bx, u), y: lerp(G.tipY, SURF, u) - Math.sin(u * Math.PI) * (28 + 40 * G.dist) };
        if (u >= 1) { G.fly = null; landBobber(); }
      }
      break;
    }
    case 'waiting': {
      G.t += dt; G.wait -= dt; G.rodAng = -0.75; G.rodBend = 3;
      G.dip = Math.sin(G.time * 1.6) * 0.6;
      const bf = G.bf;
      if (bf && bf.state === 'hidden' && G.wait < 2.8) {
        bf.state = 'approach'; bf.x0 = Math.min(VW - 40, G.bx + 90 + Math.random() * 70); bf.y0 = clamp(G.hookY + rnd(-18, 30), SURF + 14, floorY(G.bx) - 12); bf.u0 = G.wait;
      }
      if (bf && bf.state === 'approach') {
        const s = SPR[bf.f.id], hw = s ? s.canvas.width / 2 : 20, u = 1 - clamp(G.wait / bf.u0, 0, 1), e = 1 - Math.pow(1 - u, 2);
        bf.x = lerp(bf.x0, G.bx + hw - 3, e); bf.y = lerp(bf.y0, G.hookY, e); bf.ph += dt * 6;
      }
      if (G.wait <= 0) {
        if (!bf) { beginReel('Hôm nay không có cá nào cắn.', null); break; }
        G.st = 'nibble'; G.t = 0; G.nibbleDur = rnd(0.9, 2.1); bf.state = 'nibble'; G.nibT = 0; AUD.sfx('nibble');
      }
      break;
    }
    case 'nibble': {
      G.t += dt; G.rodAng = -0.75; G.rodBend = 3 + Math.sin(G.t * 40) * 1.2;
      G.nibT = (G.nibT || 0) + dt; if (G.nibT > 0.55) { G.nibT = 0; AUD.sfx('nibble'); }
      G.dip = (Math.sin(G.t * 26) > 0.5 ? 1 : 0) + (G.t % 0.55 < 0.1 ? 2 : 0);
      const bf = G.bf, s = SPR[bf.f.id], hw = s ? s.canvas.width / 2 : 20;
      bf.x = G.bx + hw - 3 + Math.sin(G.t * 30) * 1.2; bf.y = G.hookY + Math.sin(G.t * 11) * 1.5; bf.ph += dt * 10;
      if (G.t >= G.nibbleDur) { G.st = 'bite'; G.t = 0; G.shake = 4; bf.state = 'bite'; AUD.sfx('bite'); emit('drop', G.bx, SURF, 5); emit('ring', G.bx, SURF, 1); }
      break;
    }
    case 'bite': {
      G.t += dt; G.dip = 6; G.rodAng = -0.75; G.rodBend = 9;
      const bf = G.bf; bf.ph += dt * 14;
      if (G.t > hookWindow()) { beginReel('Cá nhả mồi rồi, nhanh tay hơn nhé.', null); }
      break;
    }
    case 'fight': updateFight(dt); break;
    case 'landing': {
      const L = G.land; L.t += dt; G.rodAng = -1.25; G.rodBend = 10;
      if (L.t >= L.dur) { G.land = null; G.st = 'idle'; showCatchModal(L.res); }
      break;
    }
    case 'reel': {
      G.t += dt; G.hold = false; G.rodAng = lerp(-1.0, -0.75, clamp(G.t / 0.7, 0, 1)); G.rodBend = 3;
      const u = clamp(G.t / 0.7, 0, 1);
      G.bx = lerp(G.rx0 == null ? G.bx : G.rx0, DOCKW + 6, u); G.by = SURF; G.dip = 0;
      if (G.bf) { G.bf.leave = true; G.bf.x += 60 * dt; }
      if (u >= 1) { G.st = 'idle'; G.bf = null; G.rx0 = null; }
      break;
    }
  }
  if (G.esc) { G.esc.t += dt; G.esc.x += 90 * dt; if (G.esc.t > 0.9) G.esc = null; }
  if (G.st !== 'fight') { fightHudHide(); AUD.fightFeel(false, 0, false, 0); } else fightHudUpdate();
  meterSync();
}

function updateFight(dt) {
  const F = G.fight, f = F.f, P = PATTERNS[f.pat] || PATTERNS.steady, R = rod();
  F.t += dt;
  const reeling = G.hold;
  /* --- nhịp của cá: yên, báo hiệu, lao, mệt --- */
  if (F.ph === 'tired') {
    F.tiredT -= dt;
    if (F.tiredT <= 0) { F.ph = 'calm'; F.winds++; F.stam = clamp(0.62 + 0.05 * f.pow - (F.prog > 0.7 ? 0.25 : 0), 0.35, 0.8); F.nextDash = rnd(1.1, 2.2); }
  } else if (F.ph === 'calm') {
    F.nextDash -= dt;
    if (F.nextDash <= 0 && P.dash > 0) { F.ph = 'warn'; F.tm = clamp(0.58 - 0.04 * f.pow, 0.26, 0.55); F.fake = Math.random() < (P.feint || 0); AUD.sfx('warn'); }
  } else if (F.ph === 'warn') {
    F.tm -= dt;
    if (F.tm <= 0) {
      if (F.fake) { F.ph = 'calm'; F.nextDash = rnd(P.every[0], P.every[1]) * 0.6; F.fake = false; }
      else { F.ph = 'dash'; F.dur = rnd(P.dur[0], P.dur[1]); F.tm = F.dur; AUD.sfx('dash'); }
    }
  } else {
    F.tm -= dt;
    if (F.tm <= 0) {
      if (Math.random() < (P.chain || 0) && F.stam > 0.3) { F.ph = 'warn'; F.tm = 0.22; F.fake = false; AUD.sfx('warn'); }
      else { F.ph = 'calm'; F.nextDash = rnd(P.every[0], P.every[1]); }
    }
  }
  if ((F.ph === 'calm' || F.ph === 'warn') && F.stam <= 0.2) {
    F.ph = 'tired'; F.tiredT = clamp(3.6 - 0.25 * f.pow - 0.25 * f.rar, 1.9, 3.6); F.fake = false; AUD.sfx('tired'); emit('spark', F.x, F.y, 6);
  }
  const tired = F.ph === 'tired';
  /* --- lực kéo của cá --- */
  const ratio = F.ratio * (0.6 + 0.4 * F.stam) * (G.act.calm > 0 ? 0.45 : 1) * (tired ? 0.35 : 1);
  const w1 = Math.sin(F.t * P.wf), w2 = Math.sin(F.t * P.wf * 2.3 + 1.3) * 0.5;
  const base = Math.max(0.02, P.base + P.wave * (w1 + w2) * 0.7) * ratio;
  let env = 0; if (F.ph === 'dash') { const u = 1 - F.tm / F.dur; env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.6); }
  const pull = base + P.dash * ratio * env; F.pull = pull; F.env = env;
  const target = reeling ? pull + CFG.reelStrain * (G.act.power > 0 ? 1.12 : 1) * (1 + 1.2 * env) : pull * CFG.releaseFactor;
  F.T = clamp(F.T + (target - F.T) * Math.min(1, dt / 0.2), 0, 1.3);
  F.sweet = F.T >= CFG.sweetLo && F.T <= CFG.sweetHi;
  /* --- sức cá: nhả dây lúc cá lao và mài lúc cá yên thì cá mệt --- */
  if (!tired) {
    let d;
    if (F.ph === 'dash') d = reeling ? 0.04 : 0.30 * (0.4 + 0.6 * env);
    else d = reeling ? (F.T >= CFG.sweetLo ? 0.09 : 0.03) : -0.025;
    F.stam = clamp(F.stam - (d > 0 ? d / F.endur : d) * dt, 0, 1);
  }
  /* --- tiến độ kéo cá --- */
  let eff = tired ? 1.9 : (F.ph === 'dash' ? 0.08 : 0.18 + 0.8 * Math.pow(1 - F.stam, 1.3));
  F.eff = eff;
  if (reeling) F.prog += R.reel * (1 + 0.07 * S.pass.arms) * (G.act.power > 0 ? 2 : 1) * (F.sweet ? 1.2 : 1) * eff / F.work * dt;
  else if (F.ph === 'dash') F.prog -= (0.07 + 0.09 * ratio) * env * dt;
  else if (!tired) F.prog -= 0.02 * dt;
  F.prog = clamp(F.prog, 0, 1.02);
  if (F.T > CFG.snapAt) F.snap += dt; else F.snap = Math.max(0, F.snap - dt * 1.5);
  if (F.T < CFG.slackAt && !tired) F.slack += dt; else F.slack = Math.max(0, F.slack - dt * 2);
  G.rodAng = -0.95 + 0.2 * F.T; G.rodBend = 4 + 16 * clamp(F.T, 0, 1.1);
  AUD.fightFeel(true, F.T, reeling, F.prog);
  if (reeling) AUD.reelTick(dt, F.T, tired ? 1.2 : eff);
  if (F.snap > CFG.snapTime) { failFight('Dây đứt rồi! Cá lao mà còn cuộn là đứt.', 'bad', true); return; }
  if (F.slack > CFG.slackTime) { failFight('Dây chùng, cá nhả lưỡi thoát mất. Cá chưa mệt thì đừng thả lâu.', 'bad'); return; }
  if (F.prog >= 1) { landFish(); return; }
  const e = 1 - Math.pow(1 - F.prog, 2);
  const spr = SPR[f.id], hw = spr ? spr.canvas.width / 2 : 20;
  F.x = clamp(lerp(F.sx, distToX(0.04) + hw, e) + F.env * 12 + (tired ? 0 : Math.sin(F.t * 1.7) * 3), DOCKW + hw + 6, VW - hw - 4);
  F.y = clamp(lerp(F.sy, SURF + 24, e * 0.85) + (tired ? -4 : Math.sin(F.t * 2.3) * 4) + (f.pat === 'dive' ? F.env * 18 : 0), SURF + 14, floorY(F.x) - 12);
  F.ap += dt * (tired ? 2.2 : 5 + 14 * F.pull + (F.ph === 'dash' ? 8 : 0));
  F.amp = tired ? 0.9 : 1.2 + 5 * F.T + (F.ph === 'dash' ? 3 : 0) + (F.ph === 'warn' ? 1.5 : 0);
  F.tilt = tired ? 0.38 + Math.sin(F.t * 2) * 0.05 : Math.sin(F.t * (6 + 10 * F.pull)) * (0.05 + 0.22 * clamp(F.T, 0, 1)) + (F.ph === 'dash' ? 0.1 : 0);
  if (!tired && Math.random() < dt * (1 + 6 * F.T)) emit('bubble', F.x, F.y - 4, 1);
  if (F.ph === 'dash' && Math.random() < dt * 14) emit('bubble', F.x + hw, F.y, 1);
}

function landFish() {
  const F = G.fight, f = F.f, w = F.w, v = baseValue(f, w);
  const j = S.journal[f.id] || (S.journal[f.id] = { n: 0, best: 0, first: Date.now() });
  const isNew = j.n === 0, record = w > j.best && j.n > 0;
  j.n++; if (w > j.best) j.best = w;
  S.bag.push({ fid: f.id, w, v, t: Date.now() });
  S.stats.caught++;
  const xp = Math.round(5 + f.pow * 7 + f.rar * 12) + (isNew ? 10 : 0);
  S.xp += xp;
  const ups = [], unlocked = [];
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level++; S.sp++; ups.push(S.level);
    ACTIVE_SKILLS.forEach(k => { if (k.lvl === S.level) unlocked.push(k.name); });
  }
  const mouthSpr = SPR[f.id];
  G.land = { t: 0, dur: 0.95, f, x0: F.x, y0: F.y, res: { f, w, v, isNew, record, xp, ups, unlocked, legend: f.rar === 4 } };
  G.st = 'landing'; G.hold = false; G.fight = null; G.bf = null;
  emit('drop', F.x, SURF, 12); emit('ring', F.x, SURF, 1, { big: 16 });
  AUD.sfx('land'); setTimeout(() => AUD.sfx('catchOk', f.rar), 250); if (ups.length) setTimeout(() => AUD.sfx('level'), 900);
  saveSoon();
}

/* ---------- kỹ năng ---------- */
function useSkill(id) {
  const sk = ACTIVE_SKILLS.find(k => k.id === id); if (!sk || uiLocked()) return;
  if (S.level < sk.lvl) { toast('Kỹ năng ' + sk.name + ' mở ở cấp ' + sk.lvl + '.', 'bad'); return; }
  if (G.cool[id] > 0) return;
  if ((id === 'calm' || id === 'power') && G.st !== 'fight') { toast(sk.name + ' dùng khi đang kéo cá.', 'bad'); return; }
  if (id === 'scent') {
    if (G.st !== 'idle' && G.st !== 'power') { toast('Mồi thơm dùng trước khi quăng cần.', 'bad'); return; }
    G.scentArm = true; toast('Mồi thơm đã sẵn sàng cho lần quăng tới.', 'good');
  } else if (id === 'sonar') { G.act.sonar = sk.dur; toast('Sonar đang quét dưới nước.', 'good'); }
  else { G.act[id] = sk.dur; toast(sk.name + '!', 'good'); }
  G.cool[id] = sk.cd; emit('spark', 60, 80, 8); AUD.sfx('coin');
}

/* ---------- vẽ ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let fogGrad = null;
function drawExcl(c, x, y, col) {
  x = Math.round(x); y = Math.round(y);
  c.fillStyle = '#1a1a22'; c.fillRect(x - 3, y - 1, 6, 12); c.fillStyle = col; c.fillRect(x - 2, y, 4, 7); c.fillRect(x - 2, y + 8, 4, 2);
}
function sonarLabel(c, id, x, y) {
  const f = fishById(id); if (!f) return;
  const known = S.journal[id] && S.journal[id].n > 0, txt = known ? f.name : '???';
  c.font = '11px VT323, monospace'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#05101a'; c.fillText(txt, Math.round(x) + 1, Math.round(y) + 1);
  c.fillStyle = RARITY[f.rar].col; c.fillText(txt, Math.round(x), Math.round(y));
}
function drawSub(c, id, x, y, o, sonar) {
  const s = SPR[id]; if (!s) return;
  if (sonar) { drawFishWavy(c, s.canvas, x, y, Object.assign({ alpha: 0.95 }, o)); sonarLabel(c, id, x, y - s.canvas.height / 2 - 4); }
  else { const sl = silhouette(id); if (sl) drawFishWavy(c, sl, x, y, Object.assign({ alpha: G.st === 'fight' ? 0.12 : 0.24 }, o)); }
}
function render() {
  const L = lakeNow(), sc = sceneFor(L), cave = L.id === 'hang', hour = hourNow();
  const sky = skyAt(hour, L, G.weather), t = G.time;
  ctx.save();
  if (G.shake > 0) ctx.translate(Math.round(rnd(-1, 1) * G.shake * 0.5), Math.round(rnd(-1, 1) * G.shake * 0.5));
  if (!cave) { drawSky(ctx, sky); drawCelestial(ctx, hour, sky.dark, G.weather, t); drawClouds(ctx, G.clouds, sky.dark, G.weather); }
  ctx.drawImage(sc.sc, 0, 0); ctx.drawImage(sc.wt, 0, 0);
  /* ánh sáng dưới nước */
  for (let i = 0; i < 9; i++) { const x = (i * 63 + t * 7) % (VW + 30) - 15; ctx.fillStyle = 'rgba(255,255,255,' + (cave ? 0.02 : 0.05) + ')'; ctx.fillRect(x | 0, SURF + 6 + i * 15, 26, 1); }
  if (cave) G.motes.forEach(m => { ctx.fillStyle = 'rgba(127,255,255,' + (0.25 + 0.25 * Math.sin(t * 2 + m.p)) + ')'; ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); });
  else G.motes.forEach(m => { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); });
  drawSeaweed(ctx, L, t);
  const sonar = G.act.sonar > 0;
  /* cá dưới nước */
  G.amb.forEach(a => drawSub(ctx, a.f.id, a.x, a.y, { flip: a.dir < 0, amp: 2.2, phase: a.ph, freq: 1.0 }, sonar));
  const hx = G.bx, hy = G.hookY;
  if (G.bf && G.bf.state !== 'hidden' && (G.st === 'waiting' || G.st === 'nibble' || G.st === 'bite' || G.st === 'reel')) {
    const bf = G.bf;
    drawSub(ctx, bf.f.id, bf.x, bf.y, { flip: !bf.leave, amp: G.st === 'bite' ? 4 : 2.5, phase: bf.ph, freq: 1.0 }, sonar);
  }
  if (G.esc && G.esc.spr) { const sl = silhouette(G.esc.id); if (sl) drawFishWavy(ctx, sl, G.esc.x, G.esc.y, { flip: false, amp: 5, phase: G.esc.t * 30, alpha: 0.5 * (1 - G.esc.t / 0.9) }); }
  const F = G.fight; let mouth = null;
  if (F) {
    const s = SPR[F.f.id];
    if (s) {
      const o = { flip: true, amp: F.amp, phase: F.ap, tilt: F.tilt, freq: 1.0 };
      drawFishWavy(ctx, s.canvas, F.x, F.y, o);
      mouth = fishMouth(s.canvas, s.mouthY, F.x, F.y, o);
      if (F.ph === 'warn' && Math.floor(t * 12) % 2 === 0) drawExcl(ctx, F.x, F.y - s.canvas.height / 2 - 16, '#ffd23f');
      if (F.ph === 'dash') drawExcl(ctx, F.x, F.y - s.canvas.height / 2 - 16, '#ff5a4a');
    }
  }
  if (G.land) {
    const Lm = G.land, u = clamp(Lm.t / Lm.dur, 0, 1), s = SPR[Lm.f.id];
    const x = lerp(Lm.x0, 62, u), y = lerp(Lm.y0, SURF - 26, u) - Math.sin(u * Math.PI) * 52;
    if (s) drawFishWavy(ctx, s.canvas, x, y, { flip: true, amp: 5 * (1 - u * 0.4), phase: Lm.t * 26, tilt: Math.sin(Lm.t * 20) * 0.35 });
  }
  /* mặt nước */
  for (let x = DOCKW; x < VW; x += 5) { const a = Math.sin(t * 2 + x * 0.09); if (a > 0.55) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, SURF, 3, 1); } }
  drawFx(ctx);
  /* người câu, cần, dây */
  const bob = G.st === 'idle' || G.st === 'waiting' ? (Math.sin(t * 2) > 0.8 ? 1 : 0) : 0;
  drawFisher(ctx, bob);
  const tip = drawRod(ctx, G.rodAng, 58, G.rodBend, HAND.y + bob);
  G.tipX = tip.x; G.tipY = tip.y;
  const lineCol = F ? (F.T > 0.8 ? '#ff7a6a' : F.T > 0.55 ? '#ffe08a' : '#f1f6f4') : '#f1f6f4';
  if (G.st === 'idle' || G.st === 'power') drawLine(ctx, tip.x, tip.y, tip.x + 2, tip.y + 12, 1);
  else if (G.st === 'casting') { if (G.fly) { drawLine(ctx, tip.x, tip.y, G.fly.x, G.fly.y, 5); ctx.fillStyle = '#e04a3a'; ctx.fillRect(Math.round(G.fly.x) - 1, Math.round(G.fly.y) - 1, 3, 3); } else drawLine(ctx, tip.x, tip.y, tip.x + 2, tip.y + 12, 1); }
  else if (G.st === 'waiting' || G.st === 'nibble' || G.st === 'bite' || G.st === 'reel') {
    const by = SURF + G.dip;
    drawLine(ctx, tip.x, tip.y, G.bx, by - 6, G.st === 'bite' ? 3 : 7);
    if (G.st !== 'reel') { drawLine(ctx, G.bx, by, G.bx, hy, 0, '#cfe6ea', 0.35); ctx.fillStyle = '#d9d9e0'; ctx.fillRect(Math.round(G.bx) - 1, Math.round(hy), 2, 2); }
    drawBobber(ctx, G.bx, by);
    if (G.st === 'bite') drawExcl(ctx, G.bx, SURF - 24, '#ff5a4a');
  } else if (G.st === 'fight' && F && mouth) {
    const jitter = F.T > 0.8 ? (Math.random() < 0.5 ? 1 : 0) : 0;
    drawLine(ctx, tip.x, tip.y, mouth.x, mouth.y + jitter, 3 + (1 - clamp(F.T, 0, 1)) * 14, lineCol, 1);
  } else if (G.st === 'landing') drawLine(ctx, tip.x, tip.y, tip.x + 3, tip.y + 10, 1);
  /* thời tiết */
  if (G.weather === 'mưa' && !cave) { ctx.fillStyle = 'rgba(200,225,240,.55)'; G.rain.forEach(r => { ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 4); }); }
  if (G.weather === 'sương' && !cave) {
    if (!fogGrad) { fogGrad = ctx.createLinearGradient(0, 0, VW, 0); fogGrad.addColorStop(0, 'rgba(225,235,240,.05)'); fogGrad.addColorStop(1, 'rgba(225,235,240,.55)'); }
    ctx.fillStyle = fogGrad; ctx.fillRect(0, 0, VW, SURF + 40);
  }
  if (!cave && sky.dark > 0) { ctx.fillStyle = 'rgba(8,16,48,' + (sky.dark * 0.46) + ')'; ctx.fillRect(0, 0, VW, VH); }
  if (cave) { ctx.fillStyle = 'rgba(0,0,10,.18)'; ctx.fillRect(0, 0, VW, VH); }
  if (G.flash > 0.02) { ctx.fillStyle = 'rgba(235,240,255,' + (G.flash * 0.55) + ')'; ctx.fillRect(0, 0, VW, VH); }
  ctx.restore();
}

/* ---------- vòng lặp ---------- */
let lastT = 0, hudT = 0, saveT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016); lastT = ts;
  if (G.view === 'play' && !document.hidden) {
    if (!G.modal) updateGame(dt); else { G.time += dt; updateWorld(dt); updateFx(dt); }
    render();
  }
  hudT += dt; if (hudT > 0.12) { hudT = 0; hudTick(); }
  saveT += dt; if (saveT > 6) { saveT = 0; if (saveDirty) saveNow(); }
}

/* ===== GIAO DIỆN: HUD, cửa hàng, túi cá, sổ cá, kỹ năng, bản đồ ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const fmtKg = w => w.toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' kg';
const SLUG = { play: 'choi', shop: 'cua-hang', bag: 'tui-ca', skills: 'ky-nang', map: 'ban-do', admin: 'admin' };
const VIEW_OF = Object.fromEntries(Object.entries(SLUG).map(([k, v]) => [v, k]));

/* ---------- thông báo ---------- */
function toast(msg, kind) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast ' + (kind || ''); t.hidden = false;

}

let lastBaitSig = '', skillsBuilt = false;
function buildSkillBar() {
  $('skillBar').innerHTML = ACTIVE_SKILLS.map((k, i) =>
    '<button class="sk" type="button" data-skill="' + k.id + '" title="' + esc(k.desc) + '"><i class="cd"></i><b>' + (i + 1) + ' ' + esc(k.name) + '</b><small></small></button>').join('');

function hudTick() {
  $('cMoney').textContent = fmt(S.money) + ' xu';
  $('cLevel').textContent = 'Cấp ' + S.level + (S.sp ? ' (+' + S.sp + ' điểm)' : '');
  if (G.view !== 'play') return;
  const L = lakeNow();
  $('hLake').textContent = L.name;
  $('hTime').textContent = L.id === 'hang' ? clockText() : clockText() + ' · ' + phaseNow() + ' · ' + G.weather;
  if (!skillsBuilt) buildSkillBar();
  $('skillBar').querySelectorAll('.sk').forEach((el, i) => {
    const k = ACTIVE_SKILLS[i], lock = S.level < k.lvl, cd = G.cool[k.id], live = (G.act[k.id] || 0) > 0 || (k.id === 'scent' && G.scentArm);
    el.classList.toggle('lock', lock); el.classList.toggle('live', live);
    el.querySelector('.cd').style.width = (lock ? 0 : cd > 0 ? cd / k.cd * 100 : 0) + '%';
    el.querySelector('small').textContent = lock ? 'Mở ở cấp ' + k.lvl : cd > 0 ? Math.ceil(cd) + ' giây' : live ? 'Đang chạy' : 'Sẵn sàng';
  });
  $('gRod').textContent = rod().name;
  const sig = S.bait + '|' + JSON.stringify(S.baits);
  if (sig !== lastBaitSig) {
    lastBaitSig = sig;

    $('baitSel').innerHTML = owned.map(b => '<option value="' + b.id + '"' + (b.id === S.bait ? ' selected' : '') + '>' + esc(b.name) + ' x' + (S.baits[b.id] || 0) + '</option>').join('');

/* ---------- bản đồ, nhiệm vụ ---------- */
const LQ = { ao: { n: 6, sp: 4, big: 1.5 }, song: { n: 8, sp: 5, big: 5 }, ho: { n: 8, sp: 4, big: 12 }, bien: { n: 8, sp: 5, big: 30 }, hang: { n: 6, sp: 4, big: 60 } };
function lakeStats(id) {
  let n = 0, sp = 0, rare = 0, best = 0;
  FISH.filter(f => f.lake === id).forEach(f => { const j = S.journal[f.id]; if (j && j.n) { n += j.n; sp++; if (f.rar >= 2) rare += j.n; if (j.best > best) best = j.best; } });
  return { n, sp, rare, best };
}
function questsOf(id) {
  const i = LAKES.findIndex(l => l.id === id), L = LAKES[i], q = LQ[id], s = lakeStats(id);
  const money = Math.round(40 * Math.pow(3.2, i)), xp = Math.round(20 * Math.pow(2.2, i));
  return [
    { id: id + ':n', text: 'Câu ' + q.n + ' con cá ở ' + L.name, goal: q.n, cur: s.n, money, xp },
    { id: id + ':sp', text: 'Ghi ' + q.sp + ' loài khác nhau vào sổ cá', goal: q.sp, cur: s.sp, money, xp },
    { id: id + ':rare', text: 'Câu một con cá Hiếm trở lên', goal: 1, cur: s.rare, money: money * 2, xp: xp * 2 },
    { id: id + ':big', text: 'Câu một con nặng từ ' + q.big + ' kg', goal: 1, cur: s.best >= q.big ? 1 : 0, money: money * 2, xp: xp * 2 }
  ];
}
function unlockReqs(L) {
  const r = [{ ok: S.level >= L.lvl, t: 'Đạt cấp ' + L.lvl }, { ok: S.money >= L.cost, t: 'Có ' + fmt(L.cost) + ' xu phí vào' }];
  if (L.need) { const pl = LAKES.find(x => x.id === L.need.lake); r.push({ ok: lakeStats(L.need.lake).sp >= L.need.n, t: 'Ghi ' + L.need.n + ' loài ở ' + pl.name + ' (đang có ' + lakeStats(L.need.lake).sp + ')' }); }
  return r;
}
function travel(id) {
  if (id === S.lake) { showView('play'); return; }
  S.lake = id; G.st = 'idle'; G.fight = null; G.bf = null; G.land = null; G.hold = false; G.fx = []; G.rx0 = null;
  buildAmbient(); saveSoon(); showView('play');
  if (!S.story.includes(id)) { S.story.push(id); showStory(LAKES.find(l => l.id === id).name, STORY[id], 'Bắt đầu câu'); }
}
function renderMap() {
  const cards = LAKES.map((L, i) => {
    const un = S.unlocked.includes(L.id), here = S.lake === L.id, req = unlockReqs(L), can = req.every(x => x.ok), recRod = RODS[L.recRod];
    return '<div class="card' + (here ? ' on' : '') + (un ? '' : ' lockd') + '"><div class="row sp"><h3>' + esc(L.name) + '</h3>' + (here ? '<span class="tag" style="color:var(--teal)">Đang ở đây</span>' : '') + '</div>' +
      '<p class="small">' + esc(L.desc) + '</p><p class="small muted">Cần gợi ý: ' + esc(recRod.name) + ' · ' + FISH.filter(f => f.lake === L.id).length + ' loài cá</p>' +
      (un ? (here ? '' : '<button class="btn pri" type="button" data-act="travel" data-id="' + L.id + '">Đi tới đây</button>') :
        '<ul class="gain">' + req.map(x => '<li style="color:' + (x.ok ? 'var(--good)' : 'var(--ink)') + '">' + (x.ok ? 'Đủ: ' : 'Chưa: ') + esc(x.t) + '</li>').join('') + '</ul><button class="btn pri" type="button" data-act="unlock" data-id="' + L.id + '"' + (can ? '' : ' disabled') + '>Mở khoá hồ</button>') + '</div>';
  }).join('');

let resetArm = 0;
function onAct(el) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'closeModal': closeModal(); break;
    case 'audio': showAudio(); break;
    case 'closeCatch': closeCatch(); break;
    case 'sellLast': sellItem(S.bag.length - 1); closeCatch(); break;
    case 'buyRod': { const r = RODS.find(x => x.id === id); if (r && S.money >= r.price) { AUD.sfx('coin'); S.money -= r.price; S.rods.push(r.id); S.rod = r.id; saveSoon(); renderShop(); toast('Đã mua ' + r.name, 'good'); } break; }
    case 'equipRod': S.rod = id; saveSoon(); renderShop(); break;
    case 'buyBait': { const b = BAITS.find(x => x.id === id); if (b && S.money >= b.price * 10) { AUD.sfx('coin'); S.money -= b.price * 10; S.baits[id] = (S.baits[id] || 0) + 10; if (!(S.baits[S.bait] > 0)) S.bait = id; saveSoon(); renderShop(); } break; }
    case 'equipBait': S.bait = id; saveSoon(); renderShop(); break;
    case 'bagTab': bagTab = id; renderBag(); break;
    case 'sell': sellItem(+id); renderBag(); break;
    case 'sellAll': { if (S.bag.length) AUD.sfx('coin'); S.bag.forEach(it => { const p = salePrice(it); S.money += p; S.stats.earned += p; }); S.bag = []; saveSoon(); renderBag(); break; }
    case 'skillPlus': { const p = PASSIVES.find(x => x.id === id); if (p && S.sp > 0 && S.pass[id] < p.max) { S.sp--; S.pass[id]++; saveSoon(); renderSkills(); } break; }
    case 'travel': travel(id); break;
    case 'unlock': { const L = LAKES.find(x => x.id === id); if (L && unlockReqs(L).every(x => x.ok)) { S.money -= L.cost; S.unlocked.push(id); saveSoon(); travel(id); } break; }
    case 'claim': {
      const q = Object.values(LAKES).flatMap(l => questsOf(l.id)).find(x => x.id === id);
      if (q && q.cur >= q.goal && !S.claimed[id]) {
        S.claimed[id] = true; S.money += q.money; S.xp += q.xp;
        while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; S.sp++; toast('Lên cấp ' + S.level + '!', 'good'); }
        saveSoon(); renderMap();
      }
      break;
    }
    case 'reset':
      if (resetArm) { const keep = S.intro; S = newSave(); S.intro = keep; saveNow(); buildAmbient(); G.st = 'idle'; G.fight = null; G.bf = null; resetArm = 0; renderMap(); toast('Đã bắt đầu lại.', 'good'); }
      else { resetArm = 1; el.textContent = 'Bấm lần nữa để xoá'; setTimeout(() => { resetArm = 0; const b = $('resetBtn'); if (b) b.textContent = 'Chơi lại'; }, 3500); }
      break;
  }
}

function bindInput() {
  const unlock = () => { AUD.unlock(); };

  window.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';

  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; pressUp(); } });

  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveNow(); pressUp(); } });
}

function pipelineFull(work, params, bgOverride) {
  const W = work.width, H = work.height, sd = work.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H);
  const alphaMode = hasTransparency(sd.data, W, H), bgAuto = estimateBg(sd.data, W, H);
  const mask = computeMask(sd, W, H, params, bgOverride || bgAuto, alphaMode);
  const res = pixelize(makeCut(sd, W, H, mask), params);
  return { sd, W, H, alphaMode, bgAuto, mask, res };
}
function computeMask(sd, W, H, p, bg, alphaMode) {
  let fg;
  if (p.bgMode === 'none') fg = new Uint8Array(W * H).fill(1);
  else if (p.bgMode === 'auto' && alphaMode) fg = alphaMask(sd.data, W, H);
  else fg = autoMask(sd.data, W, H, bg, p.tol);

}
function maskToPng(mask, W, H) {
  const c = mkCanvas(W, H), x = c.getContext('2d'), id = x.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255; id.data[i * 4 + 3] = mask[i] ? 255 : 0; }
  x.putImageData(id, 0, 0); return c.toDataURL('image/png');
}
async function pngToMask(url, W, H) {
  const im = await dataUrlToImage(url), c = mkCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0, W, H); const d = x.getImageData(0, 0, W, H).data, m = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0; return m;
}

async function selectFish(id, draft) {

  const f = draft || fishById(id); if (!f) return;

      A.src = c; A.W = c.width; A.H = c.height; A.sd = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, A.W, A.H);
      A.alphaMode = hasTransparency(A.sd.data, A.W, A.H); A.bgAuto = estimateBg(A.sd.data, A.W, A.H);
      A.params = Object.assign({}, PIX_DEFAULT, f.rec.params || {}); A.bg = f.rec.bg || null;
      A.mask = f.rec.mask ? await pngToMask(f.rec.mask, A.W, A.H) : computeMask(A.sd, A.W, A.H, A.params, A.bg || A.bgAuto, A.alphaMode);

    '<label class="wide">Tên loài<input type="text" id="f_name" value="' + esc(d.name) + '"></label>' +
    '<label>Sống ở hồ<select id="f_lake">' + opt(LAKES.map(l => [l.id, l.name]), d.lake) + '</select></label>' +
    '<label>Độ hiếm<select id="f_rar">' + opt(RARITY.map((r, i) => [i, r.name]), d.rar) + '</select></label>' +
    '<label>Nặng tối thiểu (kg)<input type="number" id="f_wmin" min="0.01" step="0.01" value="' + d.wmin + '"></label>' +
    '<label>Nặng tối đa (kg)<input type="number" id="f_wmax" min="0.01" step="0.01" value="' + d.wmax + '"></label>' +
    '<label>Giá ở cân trung bình (xu)<input type="number" id="f_price" min="1" step="1" value="' + d.price + '"></label>' +
    '<label>Sức kéo (so với cần câu)<input type="number" id="f_pow" min="0.1" max="12" step="0.1" value="' + d.pow + '"></label>' +
    '<label>Kiểu giật<select id="f_pat">' + opt(Object.keys(PATTERNS).map(k => [k, PATTERNS[k].name]), d.pat) + '</select></label>' +
    '<label>Vùng nước<select id="f_zone">' + opt([['s', 'Gần bờ'], ['m', 'Giữa hồ'], ['d', 'Xa và sâu']], d.zone) + '</select></label>' +
    '<label class="wide">Mồi ưa thích<span class="checks">' + checks('lk', Object.keys(BAIT_KINDS).map(k => [k, BAIT_KINDS[k]]), d.likes || []) + '</span></label>' +
    '<label class="wide">Hay cắn lúc (bỏ trống là lúc nào cũng được)<span class="checks">' + checks('tm', TIMES.map(t => [t, t]), (d.when && d.when.t) || []) + '</span></label>' +
    '<label class="wide">Thời tiết ưa thích (bỏ trống là mọi thời tiết)<span class="checks">' + checks('wx', WEATHERS.map(t => [t, t]), (d.when && d.when.w) || []) + '</span></label>' +
    '<label class="wide">Mô tả trong sổ cá<textarea id="f_desc" rows="3">' + esc(d.desc) + '</textarea></label></div></div>';
  if (A.src) { drawSrc(); drawCut(); drawSpr(); }
  setSwatch();
}

/* ---------- xử lý ảnh trong trang ---------- */
async function handleFiles(files, bulk) {
  if (bulk || files.length > 1) return bulkUpload(files);
  try {
    const im = await fileToImage(files[0]), work = imageToWork(im, 420);
    if (!A.draft) return;
    A.src = work; A.W = work.width; A.H = work.height; A.bg = null;
    const r = pipelineFull(work, A.params, null);
    A.sd = r.sd; A.alphaMode = r.alphaMode; A.bgAuto = r.bgAuto; A.mask = r.mask; A.res = r.res;
    if (A.draft.isNew && /^Loài mới$/.test(A.draft.name)) { const nm = nameFromFile(files[0].name); if (nm) A.draft.name = nm; }
    refreshEditor(); showMsg(A.res ? 'Đã xử lý ảnh. Chỉnh thanh trượt nếu chưa ưng, rồi bấm Lưu loài này.' : 'Không còn gì sau khi tách nền. Giảm ngưỡng tách nền hoặc chọn Giữ nguyên ảnh.', A.res ? '' : 'warn');
  } catch (e) { showMsg(e.message || 'Không đọc được ảnh', 'warn'); }
}
function nameFromFile(n) { n = n.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ').trim(); return n ? n.charAt(0).toUpperCase() + n.slice(1) : ''; }
async function bulkUpload(files) {
  const lake = A.lakeFilter !== 'all' ? A.lakeFilter : S.lake; let ok = 0, bad = 0;
  for (const f of files) {
    try {
      const work = imageToWork(await fileToImage(f), 420), p = Object.assign({}, PIX_DEFAULT), r = pipelineFull(work, p, null);
      if (!r.res) { bad++; continue; }
      const d = DRAFT_NEW(lake); d.id += '_' + ok; d.name = nameFromFile(f.name) || 'Loài mới'; d.len = r.res.canvas.width; delete d.isNew;
      const rec = recFromDraft(d); rec.sprite = r.res.canvas.toDataURL('image/png'); rec.mouthY = r.res.mouthY;
      work.getContext('2d'); rec.src = work.toDataURL('image/jpeg', 0.86); rec.mask = maskToPng(r.mask, r.W, r.H); rec.params = p; rec.bg = null;
      await DB.put(rec); ok++;
    } catch (e) { bad++; }
  }
  await rebuildFish(); refreshTop(); refreshList();
  showMsg('Đã thêm ' + ok + ' loài mới' + (bad ? ', ' + bad + ' ảnh không đọc được' : '') + '. Bấm vào từng loài để chỉnh tên và thuộc tính.', bad ? 'warn' : '');
}
function recompute(maskToo) {
  if (!A.src) return;
  if (maskToo) A.mask = computeMask(A.sd, A.W, A.H, A.params, A.bg || A.bgAuto, A.alphaMode);
  A.res = pixelize(makeCut(A.sd, A.W, A.H, A.mask), A.params);
  drawCut(); drawSpr(); setSwatch();
}
function later(key, fn, ms) { clearTimeout(A.tmr[key]); A.tmr[key] = setTimeout(fn, ms); }
function drawSrc() { const c = $('srcCv'); if (!c || !A.src) return; c.width = A.W; c.height = A.H; c.getContext('2d').drawImage(A.src, 0, 0); c.className = A.tool === 'pick' ? 'pick' : ''; }
function drawCut() {
  const c = $('cutCv'); if (!c || !A.src) return; c.width = A.W; c.height = A.H;
  const x = c.getContext('2d'), id = x.createImageData(A.W, A.H), s = A.sd.data;
  for (let i = 0; i < A.W * A.H; i++) { id.data[i * 4] = s[i * 4]; id.data[i * 4 + 1] = s[i * 4 + 1]; id.data[i * 4 + 2] = s[i * 4 + 2]; id.data[i * 4 + 3] = A.mask[i] ? 255 : 0; }
  x.putImageData(id, 0, 0); c.className = (A.tool === 'erase' || A.tool === 'restore') ? 'brush' : '';
}
function drawSpr() {
  const c = $('sprCv'), info = $('sprInfo'); if (!c) return;
  if (!A.res) { c.width = 8; c.height = 8; if (info) info.textContent = 'Không còn gì sau khi tách nền'; return; }
  const r = A.res.canvas; c.width = r.width; c.height = r.height; c.getContext('2d').drawImage(r, 0, 0);
  const k = Math.max(1, Math.min(8, Math.floor(260 / r.width))); c.style.width = r.width * k + 'px';
  if (info) info.textContent = 'Cá pixel ' + r.width + 'x' + r.height + ' px, ' + A.res.palette.length + ' màu' + (A.res.headWasLeft ? ', đã lật cho đầu quay phải' : '');
}
function setSwatch() { const s = $('bgSw'); if (s) { const c = A.bg || A.bgAuto; s.style.background = rgbStr(c); s.title = A.bg ? 'Màu bạn chọn' : 'Màu tự đoán từ viền ảnh'; } }
function showMsg(t, kind) { const m = $('eMsg'); if (!m) return; m.hidden = !t; m.textContent = t || ''; m.className = 'note' + (kind ? ' ' + kind : ''); }

/* ---------- lưu ---------- */
function readForm() {
  const d = A.draft; if (!d || !$('f_name')) return;
  d.name = $('f_name').value.trim() || 'Loài mới'; d.lake = $('f_lake').value; d.rar = +$('f_rar').value;
  d.wmin = Math.max(0.01, +$('f_wmin').value || 0.1); d.wmax = Math.max(d.wmin, +$('f_wmax').value || 1);
  d.price = Math.max(1, +$('f_price').value || 1); d.pow = clamp(+$('f_pow').value || 1, 0.1, 12);
  d.pat = $('f_pat').value; d.zone = $('f_zone').value; d.desc = $('f_desc').value.trim();
  const get = cls => [...document.querySelectorAll('#v-admin .' + cls + ':checked')].map(i => i.value);
  d.likes = get('lk'); const t = get('tm'), w = get('wx'); d.when = (t.length || w.length) ? { t: t.length ? t : undefined, w: w.length ? w : undefined } : null;
  if (d.when) { if (!d.when.t) delete d.when.t; if (!d.when.w) delete d.when.w; }
}
function recFromDraft(d) {
  return { id: d.id, name: d.name, lake: d.lake, rar: d.rar, wmin: d.wmin, wmax: d.wmax, price: d.price, pow: d.pow, pat: d.pat, zone: d.zone, likes: d.likes, when: d.when, col: d.col || '#7a8a96', len: d.len || 56, desc: d.desc };
}
async function saveFish() {
  readForm(); const d = A.draft; if (!d) return;
  const rec = recFromDraft(d), old = fishById(d.id) && fishById(d.id).rec;
  if (A.res && A.src) {
    rec.sprite = A.res.canvas.toDataURL('image/png'); rec.mouthY = A.res.mouthY; rec.len = A.res.canvas.width;
    rec.src = A.src.toDataURL('image/jpeg', 0.86); rec.mask = maskToPng(A.mask, A.W, A.H); rec.params = Object.assign({}, A.params); rec.bg = A.bg;
  } else if (old) { ['sprite', 'mouthY', 'src', 'mask', 'params', 'bg'].forEach(k => { if (old[k] !== undefined) rec[k] = old[k]; }); }
  const ok = await DB.put(rec);
  delete d.isNew; await rebuildFish(); refreshTop(); refreshList();
  const t = $('eTitle'); if (t) t.textContent = d.name;
  buildAmbient(); saveSoon();
  showMsg(ok ? 'Đã lưu. Cá này sẽ xuất hiện trong game ở ' + (LAKES.find(l => l.id === d.lake) || {}).name + '.' : 'Đã áp dụng nhưng trình duyệt không lưu được, hãy dùng Xuất gói cá.', ok ? '' : 'warn');
  const th = $('curImg'); if (th) th.src = spriteURL(d.id);
}
let removeArm = 0;
async function removeFish(btn) {
  if (!removeArm) { removeArm = 1; btn.textContent = 'Bấm lần nữa để xác nhận'; setTimeout(() => { removeArm = 0; const b = $('rmBtn'); if (b) b.textContent = A.draft && !A.draft.custom ? 'Khôi phục mặc định' : 'Xoá loài'; }, 3500); return; }
  removeArm = 0; const id = A.sel; await DB.del(id); await rebuildFish(); buildAmbient();
  A.sel = null; A.draft = null; const next = fishById(id) || FISH[0]; refreshTop(); selectFish(next ? next.id : null);
}

/* ---------- xuất, nhập ---------- */
async function doExport(full) {
  const recs = (await DB.all()).map(r => { const o = Object.assign({}, r); if (!full) { delete o.src; delete o.mask; } return o; });
  const text = JSON.stringify({ app: 'caucapixel', v: 1, fish: recs });
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  const area = $('expArea');
  if (dl) { try { await dl.save({ filename: 'goi-ca-pixel.json', data: text }); area.innerHTML = '<div class="note">Đã gửi yêu cầu lưu file goi-ca-pixel.json (' + recs.length + ' loài đã chỉnh).</div>'; return; } catch (e) { /* rơi xuống sao chép */ } }
  A.exportText = text;
  area.innerHTML = '<div class="note">Gói gồm ' + recs.length + ' loài đã chỉnh. Sao chép đoạn này, dán vào file .json để giữ, rồi dùng Nhập gói cá để nạp lại.</div><textarea class="exp" id="expText" readonly></textarea><div class="row" style="margin-top:6px"><button class="btn" type="button" data-a="copyExp">Sao chép</button></div>';
  $('expText').value = text;
}
async function doImportText(text) {
  try {
    const o = JSON.parse(text); if (!o || !Array.isArray(o.fish)) throw new Error('bad');
    let n = 0; for (const r of o.fish) { if (r && r.id && r.name) { await DB.put(r); n++; } }
    await rebuildFish(); buildAmbient(); refreshTop(); refreshList(); A.sel = null; A.draft = null; selectFish((FISH[0] || {}).id);
    $('expArea').innerHTML = '<div class="note">Đã nhập ' + n + ' loài.</div>';
  } catch (e) { $('expArea').innerHTML = '<div class="note warn">File này không phải gói cá hợp lệ.</div>'; }
}

/* ---------- sự kiện ---------- */
function onAdminClick(e) {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a;
  if (a === 'pick') { readForm(); selectFish(t.dataset.id); }
  else if (a === 'new') { readForm(); const d = DRAFT_NEW(A.lakeFilter !== 'all' ? A.lakeFilter : S.lake); selectFish(d.id, d); }
  else if (a === 'choose') $('oneFile').click();
  else if (a === 'bulk') $('bulkFile').click();
  else if (a === 'save') saveFish();
  else if (a === 'remove') removeFish(t);
  else if (a === 'tool') { A.tool = t.dataset.t; drawSrc(); drawCut(); }
  else if (a === 'anim') { if (t.dataset.s === 'flip') A.flip = !A.flip; else { A.animState = t.dataset.s; A.t0 = performance.now(); } }
  else if (a === 'export') doExport(false);
  else if (a === 'exportFull') doExport(true);
  else if (a === 'import') $('importFile').click();
  else if (a === 'copyExp') { const ta = $('expText'); ta.select(); let ok = false; try { navigator.clipboard.writeText(A.exportText).then(() => toast('Đã sao chép', 'good'), () => { document.execCommand && document.execCommand('copy'); }); ok = true; } catch (er) { /* chọn thủ công */ } if (!ok) { try { document.execCommand('copy'); } catch (er) { /* bỏ */ } } }
}
function onAdminChange(e) {
  const t = e.target;
  if (t.id === 'lakeFilter') { A.lakeFilter = t.value; refreshList(); return; }
  if (t.id === 'oneFile' && t.files && t.files[0]) { handleFiles([t.files[0]], false); t.value = ''; return; }
  if (t.id === 'bulkFile' && t.files && t.files.length) { bulkUpload([...t.files]); t.value = ''; return; }
  if (t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => doImportText(String(r.result)); r.readAsText(t.files[0]); t.value = ''; return; }
  if (t.dataset && t.dataset.p) setParam(t);
}
function onAdminInput(e) {
  const t = e.target;
  if (t.dataset && t.dataset.p && t.type === 'range') setParam(t);
  else if (t.dataset && t.dataset.brush) A.brush = +t.value;
  else if (t.id === 'f_name') { const h = $('eTitle'); if (h) h.textContent = t.value || 'Loài mới'; }
}
function setParam(t) {
  const k = t.dataset.p; let v = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : (t.tagName === 'SELECT' && k === 'width' ? +t.value : t.value);
  A.params[k] = v; const lbl = $('v_' + k); if (lbl) lbl.textContent = v;
  if (!A.src) return;
  if (k === 'tol' || k === 'erode' || k === 'bgMode') later('m', () => recompute(true), 120); else later('s', () => recompute(false), 60);
}
/* cọ tô và chọn màu nền */
(function () {
  let painting = false;
  const pos = (cv, e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const paint = e => {
    const cv = $('cutCv'); if (!cv || !A.mask) return; const p = pos(cv, e), r = A.brush, v = A.tool === 'restore' ? 1 : 0;
    for (let y = Math.max(0, Math.floor(p.y - r)); y <= Math.min(A.H - 1, Math.ceil(p.y + r)); y++) for (let x = Math.max(0, Math.floor(p.x - r)); x <= Math.min(A.W - 1, Math.ceil(p.x + r)); x++) if ((x - p.x) * (x - p.x) + (y - p.y) * (y - p.y) <= r * r) A.mask[y * A.W + x] = v;
    drawCut();
  };
  document.addEventListener('pointerdown', e => {
    if (e.target.id === 'cutCv' && (A.tool === 'erase' || A.tool === 'restore')) { painting = true; e.target.setPointerCapture(e.pointerId); paint(e); e.preventDefault(); }
    else if (e.target.id === 'srcCv' && A.tool === 'pick') { const p = pos(e.target, e), i = (Math.min(A.H - 1, Math.floor(p.y)) * A.W + Math.min(A.W - 1, Math.floor(p.x))) * 4; A.bg = [A.sd.data[i], A.sd.data[i + 1], A.sd.data[i + 2]]; A.params.bgMode = 'color'; A.tool = 'none'; const s = document.querySelector('[data-p="bgMode"]'); if (s) s.value = 'color'; recompute(true); drawSrc(); }
  });
  document.addEventListener('pointermove', e => { if (painting) paint(e); });
  const end = () => { if (painting) { painting = false; recompute(false); } };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();

/* ---------- xem thử chuyển động ---------- */
function curSprite() {
  const d = A.draft; if (!d) return null;
  if (A.res) return { canvas: A.res.canvas };
  return SPR[d.id] ? { canvas: SPR[d.id].canvas } : null;
}
function startAnim() {
  if (A.raf) return;
  const loop = ts => {
    A.raf = requestAnimationFrame(loop);
    if (G.view !== 'admin') return;
    const c = $('animCv'); if (!c) return;
    const s = curSprite(); const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    for (let y = 0; y < 150; y += 5) { x.fillStyle = rgbStr(mixRgb([60, 150, 150], [20, 70, 100], y / 150)); x.fillRect(0, y, 320, 5); }
    x.fillStyle = 'rgba(255,255,255,.4)'; x.fillRect(0, 10, 320, 1);
    if (!s) return;
    const t = ts / 1000, W = s.canvas.width, st = A.animState; let cx = 160, cy = 80, o;
    const dir = A.flip ? -1 : 1;
    if (st === 'swim') { cx = 160 + Math.sin(t * 0.8) * 70; const mv = Math.cos(t * 0.8) * dir > 0; o = { flip: A.flip ? !mv : mv ? false : true, amp: 2.5, phase: t * 7, freq: 1.0 }; o.flip = Math.cos(t * 0.8) < 0; if (A.flip) o.flip = !o.flip; cy = 75 + Math.sin(t * 1.3) * 8; }
    else if (st === 'bite') { const k = ((ts - A.t0) / 1000) % 2.2; const lunge = k < 0.35 ? k / 0.35 : k < 0.7 ? 1 - (k - 0.35) / 0.35 * 1.2 : 0; cx = 190 - lunge * 40 * dir; cy = 80; o = { flip: !A.flip, amp: 2 + lunge * 4, phase: t * 10, freq: 1.0 }; x.fillStyle = '#e04a3a'; x.fillRect(120, 10, 3, 6); x.fillStyle = '#fff'; x.fillRect(120, 16, 3, 5); x.fillStyle = '#e9f1f2'; x.fillRect(121, 21, 1, 54); }
    else { cx = 160 + Math.sin(t * 9) * 5; cy = 80 + Math.sin(t * 6) * 4; o = { flip: !A.flip, amp: 7, phase: t * 20, tilt: Math.sin(t * 13) * 0.28, freq: 1.0 }; }
    drawFishWavy(x, s.canvas, cx, cy, o);
  };
  A.raf = requestAnimationFrame(loop);
}

/* ===== KHỞI ĐỘNG ===== */
async function boot() {
  loadSave();
  await DB.open();
  await rebuildFish();
  initWorld(); bindInput(); buildSkillBar();
  routeFromHash();
  requestAnimationFrame(frame);
  if (!S.intro) { S.intro = true; S.story.includes('ao') || S.story.push('ao'); saveSoon(); openModal('<h2>Ông để lại gì?</h2><p class="story">' + esc(STORY.intro) + '</p><p class="story muted small">' + esc(STORY.ao) + '</p><div class="mbtns"><button class="btn" type="button" data-act="help">Cách chơi</button><button class="btn pri" type="button" data-act="closeModal">Ra ao thôi</button></div>'); }
}
document.addEventListener('click', e => { const t = e.target.closest('[data-act="help"]'); if (t) { closeModal(); showHelp(); } });
window.__fishgame = { AUD, G, get S() { return S; }, FISH: () => FISH, SPR, pickFish, setHook, landFish, startFight: setHook, useSkill, travel, showView, saveNow };
boot().catch(err => { console.error(err); const m = document.createElement('p'); m.className = 'panel'; m.textContent = 'Không khởi động được: ' + err.message; document.body.appendChild(m); });

})();
</script>
