<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Câu Cá Pixel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=VT323&display=swap">
<style>
[hidden] { display: none !important; }
/* Bố cục: thanh tab trên cùng, khung chơi 16:9 ở giữa, bảng điều khiển bên dưới. Tông màu: gỗ ván cầu và nước ao. */
:root {
  --bg: #e7eee6; --panel: #fbf8ee; --panel2: #efe9d6; --ink: #1b2a33; --muted: #5a6b72; --line: #c8cdb6;
  --accent: #d3522a; --accent-ink: #ffffff; --teal: #137a8a; --good: #2a8a52; --bad: #c63c34; --gold: #a9780f;
  --shadow: rgba(27, 42, 51, .18); --stage-edge: #1b2a33; --track: #d9dcc8;
  --font-display: 'VT323', ui-monospace, 'Courier New', monospace;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1620; --panel: #14212d; --panel2: #1a2b3a; --ink: #e3edf0; --muted: #94a6ad; --line: #2a3d4d;
    --accent: #ff7f50; --accent-ink: #1b1209; --teal: #4cc3d4; --good: #4cc27d; --bad: #ff6b61; --gold: #e3b341;
    --shadow: rgba(0, 0, 0, .45); --stage-edge: #02070c; --track: #22364a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1620; --panel: #14212d; --panel2: #1a2b3a; --ink: #e3edf0; --muted: #94a6ad; --line: #2a3d4d;
  --accent: #ff7f50; --accent-ink: #1b1209; --teal: #4cc3d4; --good: #4cc27d; --bad: #ff6b61; --gold: #e3b341;
  --shadow: rgba(0, 0, 0, .45); --stage-edge: #02070c; --track: #22364a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .drop:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
h2 { font-size: 28px; } h3 { font-size: 22px; }
p { margin: 0; }
.app { max-width: 1040px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: 38px; line-height: 1; letter-spacing: .03em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--font-display); font-size: 22px; line-height: 1; padding: 6px 10px; background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--shadow); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px 0 14px; padding-bottom: 4px; scrollbar-width: thin; }
.tab { flex: none; font-family: var(--font-display); font-size: 22px; line-height: 1; padding: 8px 14px; background: var(--panel2); border: 2px solid var(--line); color: var(--muted); }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.view { display: none; }
.view.on { display: block; }
/* ---- màn chơi: toàn màn hình như một game, tay trái cần điều khiển, tay phải nút bấm ---- */
html { overscroll-behavior: none; }
body.ingame { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #0e1612; }
body.ingame .app { position: fixed; inset: 0; max-width: none; margin: 0; padding: 0; }
body.ingame .top, body.ingame .tabs { display: none; }
body.ingame main, body.ingame #v-play { height: 100%; }
.stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0e1612; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage canvas { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }
#bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bub { position: absolute; left: 0; top: 0; max-width: 200px; padding: 4px 8px; background: #fffdf2; color: #1b2a33; border: 2px solid #1b2a33; font-size: 12px; line-height: 1.28; text-align: center; border-radius: 6px; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); will-change: transform; }
.bub::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #1b2a33; border-bottom: 0; }
.bub b { display: block; font-size: 10px; color: #9a5a22; font-weight: 600; line-height: 1.1; }
.bub.me { background: #e4f4ff; }
.hud-tl { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; pointer-events: none; }
.hud-tl span, .chipi { font-family: var(--font-display); font-size: 18px; line-height: 1; padding: 4px 8px; background: rgba(8, 16, 24, .72); color: #f1f6f4; }
.hud-tr { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 62%; }
.ibtn { font-family: var(--font-display); font-size: 18px; line-height: 1; padding: 6px 10px; background: rgba(8, 16, 24, .8); color: #f1f6f4; border: 2px solid #f1f6f4; touch-action: manipulation; }
.meter, .fhud { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 56px); transform: translateX(-50%); width: min(90%, 380px); pointer-events: none; }
.meter { height: 22px; background: rgba(8, 16, 24, .8); border: 2px solid #f1f6f4; }
.meter-fill { height: 100%; width: 0; background: linear-gradient(90deg, #3fd18a, #ffd23f 60%, #ff5a4a); }
.meter-max { display: none; }
.meter-lbl { position: absolute; left: 0; right: 0; top: -21px; text-align: center; font-family: var(--font-display); font-size: 17px; color: #f1f6f4; text-shadow: 0 1px 0 #000; }
.fname { font-family: var(--font-display); font-size: 18px; color: #f1f6f4; text-shadow: 0 1px 0 #000; text-align: center; line-height: 1; margin-bottom: 2px; }
.fphase { text-align: center; font-family: var(--font-display); font-size: 20px; line-height: 1; margin-bottom: 4px; color: #cfe3ea; text-shadow: 0 1px 0 #000; }
.tbar { position: relative; height: 20px; background: rgba(8, 16, 24, .82); border: 2px solid #f1f6f4; }
.tbar .z { position: absolute; top: 0; bottom: 0; }
.z.slack { left: 0; width: 15%; background: repeating-linear-gradient(45deg, #5a7a9a 0 4px, #3d556e 4px 8px); }
.z.sweet { left: 32%; width: 40%; background: #2a8a52; }
.z.danger { left: 90%; width: 10%; background: repeating-linear-gradient(45deg, #e04a3a 0 4px, #8f2a22 4px 8px); }
.tmark { position: absolute; top: -4px; bottom: -4px; width: 5px; margin-left: -2px; background: #fff; box-shadow: 0 0 0 1px #000; }
.pbar { height: 8px; margin-top: 4px; background: rgba(8, 16, 24, .82); border: 2px solid #f1f6f4; }
.pfill { height: 100%; width: 0; background: #ffd23f; }
.sbar { height: 6px; margin-top: 3px; background: rgba(8, 16, 24, .82); border: 2px solid #f1f6f4; }
.sfill { height: 100%; width: 100%; background: #58c8ff; transition: width .1s linear; }
.fhud[data-ph="warn"] .fphase { color: #ffd23f; } .fhud[data-ph="dash"] .fphase { color: #ff6a58; } .fhud[data-ph="tired"] .fphase { color: #7dffa8; }
.fhud[data-ph="tired"] .pfill { background: #7dffa8; }
.arow { display: grid; grid-template-columns: 1fr 140px; gap: 10px; align-items: center; margin: 10px 0; font-size: 14px; }
.arow input { width: 100%; }
.toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); max-width: min(86%, 460px); text-align: center; font-family: var(--font-display); font-size: 18px; line-height: 1.1; padding: 6px 12px; background: rgba(8, 16, 24, .86); color: #f1f6f4; border: 2px solid #f1f6f4; pointer-events: none; }
.toast.good { border-color: #6be39a; color: #c9ffe0; } .toast.bad { border-color: #ff8a7a; color: #ffd6d0; }
.hintline { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(44%, 340px); text-align: center; font-size: 12px; line-height: 1.3; color: #f1f6f4; text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; }
/* cần điều khiển bên trái (di chuyển để tìm điểm câu) */
.joy { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); bottom: max(22px, env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; border-radius: 50%; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .34); pointer-events: none; touch-action: none; }
.joy.on { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .6); }
.joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, .34); border: 2px solid rgba(255, 255, 255, .75); }
/* cụm nút bên phải (quăng/kéo, kỹ năng, mồi, nói chuyện) */
.pad-r { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 170px; height: 230px; pointer-events: none; }
.pad-r > * { pointer-events: auto; position: absolute; touch-action: none; user-select: none; -webkit-user-select: none; }
.act { right: 0; bottom: 0; width: 104px; height: 104px; border-radius: 50%; font-family: var(--font-display); font-size: 18px; line-height: 1.05; padding: 8px; background: var(--accent); color: var(--accent-ink); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, .45); }
.act:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .45); }
.act[disabled] { opacity: .55; }
.act.hot { background: #e03a2a; color: #fff; }
.skills { display: contents; }
.sk { position: absolute; touch-action: none; width: 50px; height: 50px; border-radius: 50%; padding: 0; overflow: hidden; background: rgba(16, 28, 40, .82); color: #f1f6f4; border: 2px solid #f1f6f4; display: grid; place-items: center; }
.sk:nth-child(1) { right: 114px; bottom: 6px; } .sk:nth-child(2) { right: 102px; bottom: 64px; } .sk:nth-child(3) { right: 56px; bottom: 110px; } .sk:nth-child(4) { right: 0; bottom: 118px; }
.sk b { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1; position: relative; }
.sk small { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 10px; line-height: 1; color: #ffe9a0; }
.sk em { position: absolute; left: 4px; top: 2px; font-style: normal; font-size: 10px; color: #aac; }
.sk .cd { position: absolute; left: 0; bottom: 0; right: 0; height: 0; background: rgba(0, 0, 0, .6); pointer-events: none; }
.sk.lock { opacity: .45; } .sk.live { border-color: #6be39a; box-shadow: 0 0 0 2px #6be39a; }
.baitBtn { right: 0; bottom: 172px; min-width: 106px; max-width: 150px; padding: 6px 10px; font-size: 13px; line-height: 1.1; border-radius: 16px; background: rgba(16, 28, 40, .82); color: #f1f6f4; border: 2px solid #f1f6f4; text-align: center; }
.talkBtn { right: 114px; bottom: 172px; padding: 6px 12px; font-family: var(--font-display); font-size: 18px; border-radius: 16px; background: #ffe9a0; color: #1b2a33; border: 2px solid #1b2a33; }
.panel { background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--shadow); padding: 14px; }
.panel + .panel, .stack > * + * { margin-top: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { background: var(--panel); border: 2px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.on { border-color: var(--teal); }
.card.lockd { opacity: .6; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.btn { font-family: var(--font-display); font-size: 20px; line-height: 1; padding: 8px 12px; background: var(--panel2); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--good); color: #fff; }
.btn.ghost { box-shadow: none; background: transparent; }
.btn[disabled] { opacity: .45; box-shadow: none; cursor: not-allowed; }
.stat { display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar { height: 8px; background: var(--track); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--teal); }
.bar.xp i { background: var(--gold); }
.tag { display: inline-block; font-family: var(--font-display); font-size: 17px; line-height: 1; padding: 3px 6px; border: 2px solid currentColor; }
.th { image-rendering: pixelated; image-rendering: crisp-edges; height: 48px; width: auto; max-width: 96px; object-fit: contain; flex: none; background: #2c6e78; border: 2px solid var(--ink); padding: 3px; }
.th.silh { filter: brightness(0); opacity: .4; }
.list { display: grid; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; padding: 8px; background: var(--panel); border: 2px solid var(--line); min-width: 0; }
.item .grow { flex: 1; min-width: 0; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(5, 12, 18, .72); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.mbox { width: min(100%, 440px); max-height: 100%; overflow-y: auto; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--shadow); padding: 18px; display: grid; gap: 10px; }
.mbox h2 { font-size: 32px; line-height: 1; }
.mbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
.cwrap { display: flex; justify-content: center; padding: 14px; background: #2c6e78; border: 2px solid var(--ink); }
.cwrap canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; height: auto; }
.badge { font-family: var(--font-display); font-size: 18px; line-height: 1; padding: 3px 7px; color: #fff; background: var(--rc, #888); }
.badge.new { background: var(--accent); }
.gain { margin: 0; padding-left: 18px; font-size: 14px; }
.story { font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
kbd { font-family: var(--font-display); font-size: 17px; padding: 0 6px; border: 2px solid var(--line); background: var(--panel2); }

/* Admin */
.adm { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: start; }
.flist { display: grid; gap: 6px; max-height: 70vh; overflow-y: auto; padding-right: 2px; }
.frow { display: flex; gap: 8px; align-items: center; text-align: left; padding: 6px; background: var(--panel); border: 2px solid var(--line); width: 100%; min-width: 0; }
.frow.on { border-color: var(--teal); background: var(--panel2); }
.frow .nm { flex: 1; min-width: 0; line-height: 1.25; }
.frow .nm b { display: block; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .th { height: 32px; max-width: 56px; padding: 2px; }
.drop { display: grid; place-items: center; gap: 4px; text-align: center; padding: 22px 12px; border: 3px dashed var(--line); background: var(--panel2); cursor: pointer; }
.drop.over { border-color: var(--teal); background: var(--panel); }
.drop b { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.form input[type=text], .form input[type=number], .form select, .form textarea { width: 100%; padding: 6px 8px; background: var(--panel); border: 2px solid var(--line); color: var(--ink); min-width: 0; }
.form .wide { grid-column: 1 / -1; }
.checks { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink); }
.checks label { display: flex; flex-direction: row; gap: 4px; align-items: center; color: var(--ink); font-size: 13px; }
.sliders { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.sliders label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.sliders label span { display: flex; justify-content: space-between; color: var(--ink); }
.sliders input[type=range] { width: 100%; accent-color: var(--teal); }
.prev { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pv { display: grid; gap: 4px; min-width: 0; }
.pv small { color: var(--muted); font-size: 12px; }
.pv .cvw { display: grid; place-items: center; min-height: 120px; padding: 6px; border: 2px solid var(--ink); background-color: #cfd6cc; background-image: linear-gradient(45deg, #b9c2b8 25%, transparent 25%, transparent 75%, #b9c2b8 75%), linear-gradient(45deg, #b9c2b8 25%, transparent 25%, transparent 75%, #b9c2b8 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; overflow: hidden; }
.pv canvas { max-width: 100%; height: auto; }
.pv canvas.crisp { image-rendering: pixelated; image-rendering: crisp-edges; }
.pv canvas.pick { cursor: crosshair; } .pv canvas.brush { cursor: cell; }
.swatch { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--ink); vertical-align: -3px; }
.note { padding: 8px 10px; background: var(--panel2); border-left: 4px solid var(--teal); font-size: 13px; }
.note.warn { border-left-color: var(--gold); }
.exp { width: 100%; min-height: 110px; font-family: ui-monospace, monospace; font-size: 11px; padding: 6px; background: var(--panel2); border: 2px solid var(--line); color: var(--ink); }
@media (max-width: 760px) {
  .adm { grid-template-columns: minmax(0, 1fr); } .flist { max-height: 260px; }
  .logo { font-size: 32px; }
}
@media (max-height: 430px) { .joy { width: 104px; height: 104px; } .pad-r { transform-origin: right bottom; transform: scale(.86); } .hintline { font-size: 11px; } }
@media (orientation: portrait) { .hintline { bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 250px); width: min(64%, 300px); left: 36%; } }
@media (max-width: 520px) { .hud-tr .ibtn { font-size: 15px; padding: 5px 8px; } .chipi, .hud-tl span { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <h1 class="logo">Câu Cá Pixel</h1>
    <div class="chips">
      <span class="chip" id="cMoney">0 xu</span>
      <span class="chip" id="cLevel">Cấp 1</span>
      <button class="btn" type="button" data-act="audio">Âm thanh</button>
      <button class="btn" id="helpBtn" type="button">Cách chơi</button>
    </div>
  </header>
  <nav class="tabs" id="nav" aria-label="Chuyển màn hình">
    <button class="tab on" type="button" data-view="play">Chơi</button>
    <button class="tab" type="button" data-view="shop">Cửa hàng</button>
    <button class="tab" type="button" data-view="bag">Túi và sổ cá</button>
    <button class="tab" type="button" data-view="skills">Kỹ năng</button>
    <button class="tab" type="button" data-view="map">Bản đồ</button>
    <button class="tab" type="button" data-view="admin">Admin</button>
  </nav>
  <main>
    <section class="view on" id="v-play">
      <div class="stage" id="stage">
        <canvas id="cv" width="400" height="225" aria-label="Khung chơi câu cá"></canvas>
        <div id="bubbles"></div>
        <div class="hud-tl"><span id="hLake"></span><span id="hTime"></span></div>

/* ===== XỬ LÝ ẢNH: ảnh cá thật -> cá pixel (chạy hoàn toàn trên trình duyệt) ===== */
const PIX_DEFAULT = { width: 64, colors: 16, tol: 40, erode: 2, sat: 1.15, con: 1.05, outline: true, dither: 0, head: 'auto', bgMode: 'auto' };

function cdist(r1, g1, b1, r2, g2, b2) {
  const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return Math.sqrt((2 * dr * dr + 4 * dg * dg + 3 * db * db) / 9);
}

function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh này')); };
    im.src = url;
  });
}
function dataUrlToImage(u) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Ảnh lỗi')); im.src = u; });
}
function imageToWork(im, maxDim) {
  maxDim = maxDim || 420;
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const s = Math.min(1, maxDim / Math.max(iw, ih));
  const w = Math.max(8, Math.round(iw * s)), h = Math.max(8, Math.round(ih * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingQuality = 'high';
  x.drawImage(im, 0, 0, w, h);
  return c;

function hasTransparency(d, w, h) {
  let n = 0; const tot = w * h;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) n++;
  return n > tot * 0.03;
}

function estimateBg(d, w, h) {
  const buckets = new Map();
  const add = (x, y) => {
    const i = (y * w + x) * 4; if (d[i + 3] < 200) return;
    const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
    let b = buckets.get(k); if (!b) { b = [0, 0, 0, 0]; buckets.set(k, b); }
    b[0] += d[i]; b[1] += d[i + 1]; b[2] += d[i + 2]; b[3]++;
  };
  for (let x = 0; x < w; x++) for (let t = 0; t < 2; t++) { add(x, t); add(x, h - 1 - t); }
  for (let y = 2; y < h - 2; y++) for (let t = 0; t < 2; t++) { add(t, y); add(w - 1 - t, y); }
  let best = null;
  for (const b of buckets.values()) if (!best || b[3] > best[3]) best = b;
  if (!best) return [255, 255, 255];
  return [best[0] / best[3], best[1] / best[3], best[2] / best[3]];
}

/* Loang từ viền vào, mọi điểm giống màu nền (hoặc đổi màu rất êm từ điểm trước) là nền. Trả về 1 = cá. */

  let qh = 0, qt = 0;
  const dbg = (i) => cdist(d[i * 4], d[i * 4 + 1], d[i * 4 + 2], bg[0], bg[1], bg[2]);
  const seed = (i) => { if (!isBg[i] && dbg(i) <= tol) { isBg[i] = 1; q[qt++] = i; } };
  for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1); }
  const nb = [1, -1, w, -w];
  while (qh < qt) {
    const i = q[qh++], x = i % w;
    for (let k = 0; k < 4; k++) {
      const j = i + nb[k];
      if (j < 0 || j >= n || isBg[j]) continue;
      if (k === 0 && x === w - 1) continue;
      if (k === 1 && x === 0) continue;
      const dj = dbg(j);
      let ok = dj <= tol;
      if (!ok && dj <= tol * 1.5) {
        const dp = cdist(d[i * 4], d[i * 4 + 1], d[i * 4 + 2], d[j * 4], d[j * 4 + 1], d[j * 4 + 2]);
        ok = dp <= tol * 0.14;

      if (ok) { isBg[j] = 1; q[qt++] = j; }

}
function alphaMask(d, w, h) {
  const fg = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) fg[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  return fg;
}

function largestComponent(m, w, h) {
  const n = w * h, lab = new Int32Array(n), q = new Int32Array(n);
  let best = 0, bestSize = 0, cur = 0;
  for (let s = 0; s < n; s++) {
    if (!m[s] || lab[s]) continue;
    cur++; let qh = 0, qt = 0; q[qt++] = s; lab[s] = cur;
    while (qh < qt) {
      const i = q[qh++], x = i % w, y = (i / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const j = yy * w + xx;
        if (m[j] && !lab[j]) { lab[j] = cur; q[qt++] = j; }
      }
    }

  }

  if (best) for (let i = 0; i < n; i++) out[i] = lab[i] === best ? 1 : 0;

}

  for (let k = 0; k < r; k++) {
    const out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (!cur[i]) continue;
      if (x === 0 || y === 0 || x === w - 1 || y === h - 1) continue;
      if (cur[i - 1] && cur[i + 1] && cur[i - w] && cur[i + w]) out[i] = 1;
    }

  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && m[yy * w + xx]) c++;
    }

  let m = largestComponent(fg, w, h);

  m = smoothMask(m, w, h);
  return largestComponent(m, w, h);

function makeCut(srcData, w, h, mask) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  const out = x.createImageData(w, h), o = out.data, s = srcData.data;
  for (let i = 0; i < w * h; i++) {
    o[i * 4] = s[i * 4]; o[i * 4 + 1] = s[i * 4 + 1]; o[i * 4 + 2] = s[i * 4 + 2];
    o[i * 4 + 3] = mask[i] ? 255 : 0;
  }
  x.putImageData(out, 0, 0);
  return c;
}

/* Đoán đầu cá nằm bên trái: thân gần đầu dày hơn thân gần đuôi */
function guessHeadLeft(alpha, w, h, bx0, bx1) {
  const len = bx1 - bx0 + 1; if (len < 6) return true;
  const col = new Float32Array(w);
  for (let y = 0; y < h; y++) for (let x = bx0; x <= bx1; x++) if (alpha[y * w + x] > 127) col[x]++;
  const avg = (a, b) => {
    const s = bx0 + Math.floor(len * a), e = bx0 + Math.max(Math.floor(len * b), Math.floor(len * a) + 1);
    let t = 0, n = 0; for (let x = s; x < e; x++) { t += col[x]; n++; } return n ? t / n : 0;
  };
  return avg(0.1, 0.36) >= avg(0.64, 0.9);

function medianCut(px, k) {
  let boxes = [px];
  while (boxes.length < k) {
    let bi = -1, bestScore = 0, bch = 0;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i]; if (b.length < 2) continue;
      let mn = [255, 255, 255], mx = [0, 0, 0];
      for (const p of b) for (let c = 0; c < 3; c++) { if (p[c] < mn[c]) mn[c] = p[c]; if (p[c] > mx[c]) mx[c] = p[c]; }
      const rg = [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]];
      const ch = rg[1] >= rg[0] && rg[1] >= rg[2] ? 1 : rg[0] >= rg[2] ? 0 : 2;
      const score = rg[ch] * Math.sqrt(b.length);
      if (score > bestScore) { bestScore = score; bi = i; bch = ch; }
    }
    if (bi < 0) break;
    const b = boxes[bi].slice().sort((a, c) => a[bch] - c[bch]);
    const mid = b.length >> 1;
    boxes.splice(bi, 1, b.slice(0, mid), b.slice(mid));
  }
  return boxes.map(b => {
    const s = [0, 0, 0]; for (const p of b) { s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; }
    return [Math.round(s[0] / b.length), Math.round(s[1] / b.length), Math.round(s[2] / b.length)];
  });

const BAYER4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = d[(y * w + x) * 4 + 3]; alpha[y * w + x] = a;
    if (a > 127) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const headLeft = o.head === 'auto' ? guessHeadLeft(alpha, w, h, x0, x1) : o.head === 'left';
  const tw = Math.max(8, Math.round(o.width));
  const th = Math.max(6, Math.min(160, Math.round(tw * bh / bw)));

  const R = new Float32Array(tw * th), G = new Float32Array(tw * th), B = new Float32Array(tw * th), A = new Float32Array(tw * th);
  for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
    let sxa = tx * bw / tw, sxb = (tx + 1) * bw / tw;
    if (headLeft) { const t = sxa; sxa = bw - sxb; sxb = bw - t; }
    const sya = ty * bh / th, syb = (ty + 1) * bh / th;
    let r = 0, g = 0, b = 0, aS = 0, wS = 0;
    for (let y = Math.floor(sya); y < Math.ceil(syb); y++) {
      const wy = Math.min(y + 1, syb) - Math.max(y, sya); if (wy <= 0) continue;
      for (let x = Math.floor(sxa); x < Math.ceil(sxb); x++) {
        const wx = Math.min(x + 1, sxb) - Math.max(x, sxa); if (wx <= 0) continue;
        const wgt = wx * wy, i = ((y0 + y) * w + (x0 + x)) * 4, a = d[i + 3] / 255;

    let bi = 0, bd = 1e9;

/* ===== LƯU CÁ: IndexedDB (ảnh đã pixel hoá + thuộc tính loài) ===== */
const DB = {
  ok: false, db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('caucapixel', 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('fish', { keyPath: 'id' }); };
        rq.onsuccess = () => { this.db = rq.result; this.ok = true; res(true); };
        rq.onerror = () => res(false); rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  all() {
    if (!this.ok) return Promise.resolve([...this.mem.values()]);
    return new Promise(res => {
      try { const rq = this.db.transaction('fish').objectStore('fish').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch (e) { res([]); }
    });
  },
  put(rec) {
    this.mem.set(rec.id, rec);
    if (!this.ok) return Promise.resolve(false);
    return new Promise(res => {
      try { const tx = this.db.transaction('fish', 'readwrite'); tx.objectStore('fish').put(rec); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); }
    });
  },
  del(id) {
    this.mem.delete(id);
    if (!this.ok) return Promise.resolve(false);
    return new Promise(res => {
      try { const tx = this.db.transaction('fish', 'readwrite'); tx.objectStore('fish').delete(id); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); }
    });
  },
  clear() {
    this.mem.clear();
    if (!this.ok) return Promise.resolve(false);
    return new Promise(res => {
      try { const tx = this.db.transaction('fish', 'readwrite'); tx.objectStore('fish').clear(); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => res(false); } catch (e) { res(false); }
    });
  }
};

function paintTerrain(M, L, pal, rnd, id) {

  const sh = L.water.map(hexRGB), landC = pal.land.map(hexRGB), shoreC = pal.shore.map(hexRGB), cave = id === 'hang';
  const wall = hexRGB('#1e1a2a'), wall2 = hexRGB('#2a2438');

    }

  }

    for (let k = 0; k < 90; k++) { const x = rnd() * WW | 0, y = rnd() * WH | 0, s = sdfAt(M, x, y); if (s > 3 && s < (id === 'ao' ? 24 : 12) && !onPier(M, x, y) && Math.hypot(x - M.spawn.x, y - M.spawn.y) > 20) { disc(cx, x, y, 3 + (rnd() * 2 | 0), '#3f8a4a'); disc(cx, x - 1, y - 1, 2, '#58a85a'); if (rnd() < 0.25) { cx.fillStyle = '#f7b6d0'; cx.fillRect(x - 1, y - 1, 3, 3); cx.fillStyle = '#fff3a0'; cx.fillRect(x, y, 1, 1); } } }
    for (let k = 0; k < 160; k++) { const x = rnd() * WW | 0, y = rnd() * WH | 0, s = sdfAt(M, x, y); if (s > -5 && s < 4 && Math.hypot(x - M.spawn.x, y - M.spawn.y) > 70 && !M.piers.some(p => x > p.x - 20 && x < p.x + p.w + 20 && y > p.y - 20 && y < p.y + p.h + 30)) { cx.fillStyle = '#5a7a3a'; for (let t = 0; t < 3; t++) cx.fillRect(x + t * 2, y - 5 - (rnd() * 4 | 0), 1, 7); cx.fillStyle = '#7a4a2a'; cx.fillRect(x + 2, y - 8, 2, 3); } }
  }

  });

}

function fishPool(lakeId) { return FISH.filter(f => f.lake === lakeId); }
function pickFish(depth, hot) {

/* ---------- hạt hiệu ứng (nhìn từ trên xuống) ---------- */

/* ---------- thao tác ---------- */

}
function pressUp() { G.hold = false; }
function startPower() {
  if ((S.baits[S.bait] || 0) <= 0) { toast('Hết ' + bait().name + '. Bấm nút mồi để đổi hoặc mua thêm trong cửa hàng.', 'bad'); return; }
  if (!fishPool(S.lake).length) { toast('Hồ này chưa có loài cá nào.', 'bad'); return; }
  if (!castPoint(G.map, G.px, G.py, G.aim, reachOf())) { toast('Phía trước không có nước. Đi tới gần mép nước hoặc ra cầu gỗ.', 'bad'); return; }

/* ---------- người chơi: di chuyển và hướng cần ---------- */
function updatePlayer(dt) {
  const M = G.map, m = G.mv, mag = Math.min(1, Math.hypot(m.x, m.y));
  const free = G.st === 'idle' || G.st === 'waiting' || G.st === 'nibble' || G.st === 'bite';
  G.moving = false;
  if (mag > 0.12 && free && !uiLocked()) {
    if (G.st !== 'idle') {
      G.moveHold += dt;
      if (G.moveHold > 0.35) { G.moveHold = 0; beginReel('Thu cần để đổi chỗ câu.', null); }
    } else {
      const len = Math.hypot(m.x, m.y) || 1, spd = 54 * mag, sx = m.x / len * spd * dt, sy = m.y / len * spd * dt;
      let moved = false;
      if (walkable(M, G.px + sx, G.py + sy)) { G.px += sx; G.py += sy; moved = true; }
      else if (walkable(M, G.px + sx, G.py)) { G.px += sx; moved = true; }
      else if (walkable(M, G.px, G.py + sy)) { G.py += sy; moved = true; }
      G.moving = moved; if (moved) G.walk += dt * 5.5;
    }
  } else G.moveHold = 0;
  // hướng cần: người chơi chỉ chuột/chạm thì theo đó, còn không thì tự quay ra phía có nước

    G.aimT -= dt;
    if (G.aimOvT > 0) G.aimOvT -= dt;
    else if (G.aimT <= 0 || G.moving) { G.aimT = 0.22; G.aimGoal = waterDir(M, G.px, G.py, G.aimGoal == null ? G.aim : G.aimGoal); }
    if (G.aimOvT <= 0 && G.aimGoal != null) G.aim = angLerp(G.aim, G.aimGoal, Math.min(1, dt * 7));
    G.face = faceOf(G.aim);
  } else if (G.st === 'fight' && G.fight) { G.aim = angLerp(G.aim, Math.atan2(G.fight.y - G.py, G.fight.x - G.px), Math.min(1, dt * 8)); G.face = faceOf(G.aim); }
  else if (G.bx && (G.st === 'waiting' || G.st === 'nibble' || G.st === 'bite' || G.st === 'casting')) { G.aim = Math.atan2(G.by - G.py, G.bx - G.px); G.face = faceOf(G.aim); }
  G.nearNpc = npcByDistance(G.px, G.py, 38, n => n.st === 'fish');
  if (G.pBubble) { G.pBubble.ttl -= dt; if (G.pBubble.ttl <= 0) G.pBubble = null; }
  // camera mượt, nhìn trước về phía cá khi đang kéo
  let tx = G.px, ty = G.py - 4;
  if (G.fight) { tx = lerp(G.px, G.fight.x, 0.35); ty = lerp(G.py, G.fight.y, 0.35); }
  let cx = tx - VW / 2, cy = ty - VH / 2;
  cx = VW >= WW ? (WW - VW) / 2 : clamp(cx, 0, WW - VW); cy = VH >= WH ? (WH - VH) / 2 : clamp(cy, 0, WH - VH);
  const k = Math.min(1, dt * 5); G.cam.x += (cx - G.cam.x) * k; G.cam.y += (cy - G.cam.y) * k;
}

/* ---------- vòng cập nhật ---------- */
function updateGame(dt) {
  G.time += dt;
  S.clock += dt * CFG.clockSpeed; if (S.clock >= 1440) S.clock -= 1440;
  G.wT -= dt; if (G.wT <= 0) changeWeather();
  Object.keys(G.cool).forEach(k => { G.cool[k] = Math.max(0, G.cool[k] - dt); });
  Object.keys(G.act).forEach(k => { G.act[k] = Math.max(0, G.act[k] - dt); });
  G.shake = Math.max(0, G.shake - dt * 14);
  updateWorld(dt); updateFx(dt); updateNpcs(dt); updatePlayer(dt);
  const M = G.map;
  switch (G.st) {
    case 'idle': G.rodAng = G.aim; G.rodBend = 2; break;
    case 'power':
      G.power += G.pdir * dt * 1.1;
      if (G.power >= 1) { G.power = 1; G.pdir = -1; } if (G.power <= 0) { G.power = 0; G.pdir = 1; }
      G.rodAng = G.aim; G.rodBend = -3 * G.power; G.prev = castPoint(M, G.px, G.py, G.aim, castDist(clamp(G.power, 0.05, 1))); break;
    case 'casting': {

      const sw = 0.2;
      if (G.t < sw) { G.rodAng = G.aim - 0.5 * (1 - G.t / sw); G.rodBend = -4; }
      else {

        const u = clamp((G.t - sw) / G.flyT, 0, 1);
        if (!G.flyFrom) G.flyFrom = { x: G.tipX, y: G.tipY };
        G.fly = { x: lerp(G.flyFrom.x, G.bx, u), y: lerp(G.flyFrom.y, G.by, u), h: Math.sin(u * Math.PI) * (10 + 0.1 * Math.hypot(G.bx - G.px, G.by - G.py)) };
        if (u >= 1) { G.fly = null; landBobber(); }
      }
      break;
    }
    case 'waiting': {
      G.t += dt; G.wait -= dt; G.rodAng = G.aim; G.rodBend = 3;
      const bf = G.bf;
      if (bf && bf.state === 'hidden' && G.wait < 2.8) {
        bf.state = 'approach'; bf.u0 = Math.max(G.wait, 0.4);
        let sx = G.bx, sy = G.by, ok = false;
        for (let k = 0; k < 10 && !ok; k++) { const a = rnd(0, 6.28), r = rnd(46, 90); sx = G.bx + Math.cos(a) * r; sy = G.by + Math.sin(a) * r; ok = isWater(M, sx, sy) && !onPier(M, sx, sy); }
        if (!ok) { sx = G.bx + 28; sy = G.by; if (!isWater(M, sx, sy)) sx = G.bx - 28; }
        bf.x0 = sx; bf.y0 = sy; bf.ang = Math.atan2(G.by - sy, G.bx - sx);
        bf.cx = G.bx - Math.cos(bf.ang) * bf.len * 0.5; bf.cy = G.by - Math.sin(bf.ang) * bf.len * 0.5;
        bf.x = sx; bf.y = sy;
      }
      if (bf && bf.state === 'approach') {
        const u = 1 - clamp(G.wait / bf.u0, 0, 1), e = 1 - Math.pow(1 - u, 2);
        bf.x = lerp(bf.x0, bf.cx, e); bf.y = lerp(bf.y0, bf.cy, e); bf.ph += dt * 6;
      }
      if (G.wait <= 0) {
        if (!bf) { beginReel('Hôm nay không có cá nào cắn.', null); break; }
        G.st = 'nibble'; G.t = 0; G.nibbleDur = rnd(0.9, 2.1); bf.state = 'nibble'; G.nibT = 0; AUD.sfx('nibble');
        if (bf.cx == null) { bf.ang = rnd(0, 6.28); bf.cx = G.bx - Math.cos(bf.ang) * bf.len * 0.5; bf.cy = G.by - Math.sin(bf.ang) * bf.len * 0.5; }
      }
      break;
    }
    case 'nibble': {
      G.t += dt; G.rodAng = G.aim; G.rodBend = 3 + Math.sin(G.t * 40) * 1.2;
      G.nibT = (G.nibT || 0) + dt; if (G.nibT > 0.55) { G.nibT = 0; AUD.sfx('nibble'); emit('ring', G.bx, G.by, 1, { big: 6, life: 0.6 }); }
      const bf = G.bf; bf.x = bf.cx + Math.sin(G.t * 30) * 1.1; bf.y = bf.cy + Math.cos(G.t * 23) * 1.1; bf.ph += dt * 10;
      if (G.t >= G.nibbleDur) { G.st = 'bite'; G.t = 0; G.shake = 4; bf.state = 'bite'; AUD.sfx('bite'); emit('drop', G.bx, G.by, 5); emit('ring', G.bx, G.by, 1); }
      break;
    }
    case 'bite': {
      G.t += dt; G.rodAng = G.aim; G.rodBend = 9;
      const bf = G.bf; bf.ph += dt * 14; bf.x = bf.cx + Math.sin(G.t * 40) * 1.5;
      if (G.t > hookWindow()) beginReel('Cá nhả mồi rồi, nhanh tay hơn nhé.', null);
      break;
    }
    case 'fight': updateFight(dt); break;
    case 'landing': {
      const L = G.land; L.t += dt; G.rodAng = G.aim; G.rodBend = 10;
      if (L.t >= L.dur) { G.land = null; G.st = 'idle'; showCatchModal(L.res); }
      break;
    }
    case 'reel': {
      G.t += dt; G.hold = false; G.rodAng = G.aim; G.rodBend = 3;
      const u = clamp(G.t / 0.7, 0, 1);
      G.bx = lerp(G.rx0 == null ? G.bx : G.rx0, G.px, u); G.by = lerp(G.ry0 == null ? G.by : G.ry0, G.py, u);
      if (G.bf && G.bf.ang != null) { G.bf.leave = true; G.bf.x += Math.cos(G.bf.ang + Math.PI) * 24 * dt; G.bf.y += Math.sin(G.bf.ang + Math.PI) * 24 * dt; }

    }

  if (G.esc) { G.esc.t += dt; G.esc.x += Math.cos(G.esc.ang) * 80 * dt; G.esc.y += Math.sin(G.esc.ang) * 80 * dt; if (G.esc.t > 0.9) G.esc = null; }
  if (G.st !== 'fight') { fightHudHide(); AUD.fightFeel(false, 0, false, 0); } else fightHudUpdate();
  meterSync();
}

function updateFight(dt) {
  const F = G.fight, f = F.f, P = PATTERNS[f.pat] || PATTERNS.steady, R = rod(), M = G.map;
  F.t += dt;
  const reeling = G.hold;
  /* --- nhịp của cá: yên, báo hiệu, lao, mệt --- */
  if (F.ph === 'tired') {
    F.tiredT -= dt;
    if (F.tiredT <= 0) { F.ph = 'calm'; F.winds++; F.stam = clamp(0.62 + 0.05 * f.pow - (F.prog > 0.7 ? 0.25 : 0), 0.35, 0.8); F.nextDash = rnd(1.1, 2.2); }
  } else if (F.ph === 'calm') {
    F.nextDash -= dt;
    if (F.nextDash <= 0 && P.dash > 0) { F.ph = 'warn'; F.tm = clamp(0.58 - 0.04 * f.pow, 0.26, 0.55); F.fake = Math.random() < (P.feint || 0); AUD.sfx('warn'); }
  } else if (F.ph === 'warn') {
    F.tm -= dt;
    if (F.tm <= 0) {
      if (F.fake) { F.ph = 'calm'; F.nextDash = rnd(P.every[0], P.every[1]) * 0.6; F.fake = false; }
      else { F.ph = 'dash'; F.dur = rnd(P.dur[0], P.dur[1]); F.tm = F.dur; F.dir = Math.random() < 0.5 ? -1 : 1; AUD.sfx('dash'); }
    }
  } else {
    F.tm -= dt;
    if (F.tm <= 0) {
      if (Math.random() < (P.chain || 0) && F.stam > 0.3) { F.ph = 'warn'; F.tm = 0.22; F.fake = false; AUD.sfx('warn'); }
      else { F.ph = 'calm'; F.nextDash = rnd(P.every[0], P.every[1]); }
    }
  }
  if ((F.ph === 'calm' || F.ph === 'warn') && F.stam <= 0.2) {
    F.ph = 'tired'; F.tiredT = clamp(3.6 - 0.25 * f.pow - 0.25 * f.rar, 1.9, 3.6); F.fake = false; AUD.sfx('tired'); emit('spark', F.x, F.y, 6);
  }
  const tired = F.ph === 'tired';
  /* --- lực kéo của cá --- */
  const ratio = F.ratio * (0.6 + 0.4 * F.stam) * (G.act.calm > 0 ? 0.45 : 1) * (tired ? 0.35 : 1);
  const w1 = Math.sin(F.t * P.wf), w2 = Math.sin(F.t * P.wf * 2.3 + 1.3) * 0.5;
  const base = Math.max(0.02, P.base + P.wave * (w1 + w2) * 0.7) * ratio;
  let env = 0; if (F.ph === 'dash') { const u = 1 - F.tm / F.dur; env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.6); }
  const pull = base + P.dash * ratio * env; F.pull = pull; F.env = env;
  const target = reeling ? pull + CFG.reelStrain * (G.act.power > 0 ? 1.12 : 1) * (1 + 1.2 * env) : pull * CFG.releaseFactor;
  F.T = clamp(F.T + (target - F.T) * Math.min(1, dt / 0.2), 0, 1.3);
  F.sweet = F.T >= CFG.sweetLo && F.T <= CFG.sweetHi;
  /* --- sức cá: nhả dây lúc cá lao và mài lúc cá yên thì cá mệt --- */
  if (!tired) {
    let d;
    if (F.ph === 'dash') d = reeling ? 0.04 : 0.30 * (0.4 + 0.6 * env);
    else d = reeling ? (F.T >= CFG.sweetLo ? 0.09 : 0.03) : -0.025;
    F.stam = clamp(F.stam - (d > 0 ? d / F.endur : d) * dt, 0, 1);
  }
  /* --- tiến độ kéo cá --- */
  const eff = tired ? 1.9 : (F.ph === 'dash' ? 0.08 : 0.18 + 0.8 * Math.pow(1 - F.stam, 1.3));
  F.eff = eff;
  if (reeling) F.prog += R.reel * (1 + 0.07 * S.pass.arms) * (G.act.power > 0 ? 2 : 1) * (F.sweet ? 1.2 : 1) * eff / F.work * dt;
  else if (F.ph === 'dash') F.prog -= (0.07 + 0.09 * ratio) * env * dt;
  else if (!tired) F.prog -= 0.02 * dt;
  F.prog = clamp(F.prog, 0, 1.02);
  if (F.T > CFG.snapAt) F.snap += dt; else F.snap = Math.max(0, F.snap - dt * 1.5);
  if (F.T < CFG.slackAt && !tired) F.slack += dt; else F.slack = Math.max(0, F.slack - dt * 2);
  G.rodAng = G.aim; G.rodBend = 4 + 12 * clamp(F.T, 0, 1.1);
  AUD.fightFeel(true, F.T, reeling, F.prog);
  if (reeling) AUD.reelTick(dt, F.T, tired ? 1.2 : eff);
  if (F.snap > CFG.snapTime) { failFight('Dây đứt rồi! Cá lao mà còn cuộn là đứt.', 'bad', true); return; }
  if (F.slack > CFG.slackTime) { failFight('Dây chùng, cá nhả lưỡi thoát mất. Cá chưa mệt thì đừng thả lâu.', 'bad'); return; }
  if (F.prog >= 1) { landFish(); return; }
  /* --- vị trí cá: cách người chơi một đoạn thu ngắn dần, lao thì kéo giãn và quẹt ngang --- */
  const e = 1 - Math.pow(1 - F.prog, 2);
  let D = lerp(F.D0, 17, e) + F.env * 16 * (f.pat === 'dive' ? 0.4 : 1);
  const swing = tired ? 0 : Math.sin(F.t * 0.9) * 0.1 + F.env * 0.5 * F.dir + Math.sin(F.t * 9) * 0.04 * F.T;
  let x = G.px + Math.cos(F.ang0 + swing) * D, y = G.py + Math.sin(F.ang0 + swing) * D;
  for (let k = 0; k < 8 && (!isWater(M, x, y) || onPier(M, x, y)); k++) { D -= 4; x = G.px + Math.cos(F.ang0 + swing * 0.4) * D; y = G.py + Math.sin(F.ang0 + swing * 0.4) * D; }
  F.x = lerp(F.x, x, Math.min(1, dt * 14)); F.y = lerp(F.y, y, Math.min(1, dt * 14));
  const toP = Math.atan2(G.py - F.y, G.px - F.x);
  F.hd = tired ? toP + 0.9 : F.ph === 'dash' ? toP + Math.PI + Math.sin(F.t * 12) * 0.35 : toP + Math.sin(F.t * (6 + 10 * F.pull)) * (0.1 + 0.4 * clamp(F.T, 0, 1));
  F.ap += dt * (tired ? 2.2 : 5 + 14 * F.pull + (F.ph === 'dash' ? 8 : 0));
  F.amp = tired ? 0.8 : 1.0 + 3 * F.T + (F.ph === 'dash' ? 2 : 0) + (F.ph === 'warn' ? 1 : 0);
  if (!tired && Math.random() < dt * (1 + 6 * F.T)) emit('bubble', F.x, F.y, 1);
  if (F.ph === 'dash' && Math.random() < dt * 14) emit('drop', F.x, F.y, 1);
}

function landFish() {
  const F = G.fight, f = F.f, w = F.w, v = baseValue(f, w);
  const j = S.journal[f.id] || (S.journal[f.id] = { n: 0, best: 0, first: Date.now() });
  const isNew = j.n === 0, record = w > j.best && j.n > 0;
  j.n++; if (w > j.best) j.best = w;
  S.bag.push({ fid: f.id, w, v, t: Date.now() });
  S.stats.caught++;
  const xp = Math.round(5 + f.pow * 7 + f.rar * 12) + (isNew ? 10 : 0);
  S.xp += xp;
  const { ups, unlocked } = levelCheck();
  G.land = { t: 0, dur: 0.95, f, x0: F.x, y0: F.y, res: { f, w, v, isNew, record, xp, ups, unlocked, legend: f.rar === 4 } };
  G.st = 'landing'; G.hold = false; G.fight = null; G.bf = null;
  emit('drop', F.x, F.y, 12); emit('ring', F.x, F.y, 1, { big: 16 });
  AUD.sfx('land'); setTimeout(() => AUD.sfx('catchOk', f.rar), 250);
  npcReact('catch', f, w);

}

  if (!nightCv || nightCv.width !== VW || nightCv.height !== VH) { nightCv = mkCanvas(VW, VH); nightCtx = nightCv.getContext('2d'); }
  const n = nightCtx; n.globalCompositeOperation = 'source-over'; n.clearRect(0, 0, VW, VH);
  n.fillStyle = 'rgba(6,10,36,' + dark + ')'; n.fillRect(0, 0, VW, VH);

  const sx = x => x - Math.round(G.cam.x) + ox, sy = y => y - Math.round(G.cam.y) + oy;

  G.npcs.forEach(p => { if (p.st === 'fish') hole(sx(p.x), sy(p.y) - 6, 40, 0.8); });

}

          n.bob = null; fs.ph = 'rest'; fs.t = rnd(2, 4);
        }
      }
      if (n.held) { n.held.t -= dt; if (n.held.t <= 0) n.held = null; }
    }
  }
}
function npcChatter(M) {
  const near = G.npcs.filter(n => n.st === 'fish' && !n.bubble);
  if (!near.length) return;
  // hai NPC đứng gần nhau thì trò chuyện qua lại
  if (near.length >= 2 && Math.random() < 0.4) {
    for (const a of near) for (const b of near) if (a !== b && Math.hypot(a.x - b.x, a.y - b.y) < 90) {
      const p = DLG.pair[Math.random() * DLG.pair.length | 0]; say(a, p[0]); setTimeout(() => say(b, p[1]), 2600); return;
    }
  }
  const n = near[Math.random() * near.length | 0], r = Math.random();
  const night = hourNow() < 5 || hourNow() >= 19;
  let pool = DLG.idle;
  if (G.weather === 'mưa' && r < 0.5) pool = DLG.rain; else if (night && r < 0.4) pool = DLG.night; else if (G.weather === 'nắng' && r < 0.3) pool = DLG.sunny; else if (G.weather === 'sương' && r < 0.4) pool = DLG.fog;
  say(n, pool[Math.random() * pool.length | 0]);
}
/* NPC phản ứng khi người chơi câu được hoặc hụt cá */

}

function talkNpc() {

let resetArm = 0;
function onAct(el) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'closeModal': closeModal(); break;
    case 'audio': showAudio(); break;
    case 'menu': showView('shop'); break;
    case 'fs': toggleFullscreen(); break;
    case 'closeCatch': closeCatch(); break;
    case 'sellLast': sellItem(S.bag.length - 1); closeCatch(); break;
    case 'buyRod': { const r = RODS.find(x => x.id === id); if (r && S.money >= r.price) { AUD.sfx('coin'); S.money -= r.price; S.rods.push(r.id); S.rod = r.id; saveSoon(); renderShop(); toast('Đã mua ' + r.name, 'good'); } break; }
    case 'equipRod': S.rod = id; saveSoon(); renderShop(); break;
    case 'buyBait': { const b = BAITS.find(x => x.id === id); if (b && S.money >= b.price * 10) { AUD.sfx('coin'); S.money -= b.price * 10; S.baits[id] = (S.baits[id] || 0) + 10; if (!(S.baits[S.bait] > 0)) S.bait = id; saveSoon(); renderShop(); } break; }
    case 'equipBait': S.bait = id; saveSoon(); renderShop(); break;
    case 'bagTab': bagTab = id; renderBag(); break;
    case 'sell': sellItem(+id); renderBag(); break;
    case 'sellAll': { if (S.bag.length) AUD.sfx('coin'); S.bag.forEach(it => { const p = salePrice(it); S.money += p; S.stats.earned += p; }); S.bag = []; saveSoon(); renderBag(); break; }
    case 'skillPlus': { const p = PASSIVES.find(x => x.id === id); if (p && S.sp > 0 && S.pass[id] < p.max) { S.sp--; S.pass[id]++; saveSoon(); renderSkills(); } break; }
    case 'travel': travel(id); break;
    case 'unlock': { const L = LAKES.find(x => x.id === id); if (L && unlockReqs(L).every(x => x.ok)) { S.money -= L.cost; S.unlocked.push(id); saveSoon(); travel(id); } break; }
    case 'claim': {
      const q = Object.values(LAKES).flatMap(l => questsOf(l.id)).find(x => x.id === id);
      if (q && q.cur >= q.goal && !S.claimed[id]) {
        S.claimed[id] = true; S.money += q.money; S.xp += q.xp;
        while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; S.sp++; toast('Lên cấp ' + S.level + '!', 'good'); }
        saveSoon(); renderMap();
      }
      break;
    }
    case 'reset':
      if (resetArm) { const keep = S.intro; S = newSave(); S.intro = keep; saveNow(); initWorld(); G.st = 'idle'; G.fight = null; G.bf = null; resetArm = 0; renderMap(); toast('Đã bắt đầu lại.', 'good'); }
      else { resetArm = 1; el.textContent = 'Bấm lần nữa để xoá'; setTimeout(() => { resetArm = 0; const b = $('resetBtn'); if (b) b.textContent = 'Chơi lại'; }, 3500); }
      break;
  }
}

/* ---------- khung nhìn, bóng thoại, toàn màn hình ---------- */

  ZOOM = z; VW = Math.min(WW, Math.floor(w / z)); VH = Math.min(WH, Math.floor(h / z));

const bubEls = {};
function syncBubbles() {
  const layer = $('bubbles'), rect = cv.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
  const ox0 = rect.left - st.left, oy0 = rect.top - st.top, ox = VW >= WW ? (VW - WW) / 2 : 0, oy = VH >= WH ? (VH - WH) / 2 : 0;

/* ---------- điều khiển ---------- */
const KEYS = {};
function keyVec() {
  const x = (KEYS.ArrowRight || KEYS.KeyD ? 1 : 0) - (KEYS.ArrowLeft || KEYS.KeyA ? 1 : 0), y = (KEYS.ArrowDown || KEYS.KeyS ? 1 : 0) - (KEYS.ArrowUp || KEYS.KeyW ? 1 : 0);
  return { x, y };
}
const JOY = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
function applyMove() { const k = keyVec(); if (JOY.id != null) { G.mv.x = JOY.x; G.mv.y = JOY.y; } else { G.mv.x = k.x; G.mv.y = k.y; } }
function bindInput() {
  const unlock = () => { AUD.unlock(); };
  window.addEventListener('pointerdown', unlock, { capture: true }); window.addEventListener('keydown', unlock, { capture: true });
  document.addEventListener('click', e => { if (e.target.closest('button') && !e.target.closest('#act')) AUD.sfx('click'); });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (t) { onAct(t); return; }
    const tab = e.target.closest('.tab'); if (tab) { showView(tab.dataset.view); return; }
    const sk = e.target.closest('[data-skill]'); if (sk) useSkill(sk.dataset.skill);
  });

  $('baitBtn').addEventListener('click', cycleBait);
  $('talkBtn').addEventListener('click', talkNpc);
  window.addEventListener('resize', resizeStage); window.addEventListener('orientationchange', () => setTimeout(resizeStage, 250));
  /* chặn phóng to trang để chơi như ứng dụng */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => { if (G.view === 'play') e.preventDefault(); }));
  document.addEventListener('touchmove', e => { if (G.view === 'play' && (e.touches.length > 1 || e.target.closest('#stage'))) e.preventDefault(); }, { passive: false });
  let lastEnd = 0; document.addEventListener('touchend', e => { const n = Date.now(); if (G.view === 'play' && n - lastEnd < 350) e.preventDefault(); lastEnd = n; }, { passive: false });
  document.addEventListener('dblclick', e => { if (G.view === 'play') e.preventDefault(); });
  document.addEventListener('wheel', e => { if (e.ctrlKey && G.view === 'play') e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#stage')) e.preventDefault(); });

  const stage = $('stage'), act = $('act'), joy = $('joy'), knob = $('joyKnob');
  const toWorld = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / ZOOM + G.cam.x - (VW >= WW ? (VW - WW) / 2 : 0), y: (e.clientY - r.top) / ZOOM + G.cam.y - (VH >= WH ? (VH - WH) / 2 : 0) }; };
  const aimFrom = e => { const w = toWorld(e); aimAt(w.x - G.px, w.y - (G.py - 6)); };
  let aimId = null;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || G.modal) return;
    if (e.pointerType === 'mouse') { if (e.button > 0) return; aimFrom(e); pressDown(); return; }
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.5 && JOY.id == null) {
      JOY.id = e.pointerId; JOY.ox = e.clientX; JOY.oy = e.clientY; JOY.x = JOY.y = 0;
      joy.style.left = (e.clientX - r.left - joy.offsetWidth / 2) + 'px'; joy.style.top = (e.clientY - r.top - joy.offsetHeight / 2) + 'px'; joy.style.bottom = 'auto'; joy.classList.add('on');
      try { stage.setPointerCapture(e.pointerId); } catch (x) { /* bỏ qua */ }
    } else if (aimId == null) { aimId = e.pointerId; aimFrom(e); try { stage.setPointerCapture(e.pointerId); } catch (x) { /* bỏ qua */ } }
  });
  stage.addEventListener('pointermove', e => {
    if (e.pointerId === JOY.id) {
      const R = 46; let dx = e.clientX - JOY.ox, dy = e.clientY - JOY.oy; const d = Math.hypot(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      JOY.x = dx / R; JOY.y = dy / R; knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; applyMove();
    } else if (e.pointerId === aimId) aimFrom(e);
    else if (e.pointerType === 'mouse' && !e.target.closest('button') && G.st === 'idle' || e.pointerType === 'mouse' && G.st === 'power') aimFrom(e);
  });
  const endPtr = e => {
    if (e.pointerId === JOY.id) { JOY.id = null; JOY.x = JOY.y = 0; knob.style.transform = ''; joy.classList.remove('on'); joy.style.left = joy.style.top = ''; joy.style.bottom = ''; applyMove(); }
    if (e.pointerId === aimId) aimId = null;
    if (e.pointerType === 'mouse') pressUp();
  };
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, endPtr));
  act.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); try { act.setPointerCapture(e.pointerId); } catch (x) { /* bỏ qua */ } pressDown(); });
  ['pointerup', 'pointercancel'].forEach(ev => act.addEventListener(ev, pressUp));
  window.addEventListener('pointerup', pressUp); window.addEventListener('blur', () => { pressUp(); for (const k in KEYS) KEYS[k] = false; JOY.id = null; applyMove(); });
  let spaceDown = false;
  const typing = e => { const tag = (e.target && e.target.tagName) || ''; return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'; };
  window.addEventListener('keydown', e => {
    if (typing(e)) return;
    if (e.code === 'Escape') { if (G.modal) closeModal(); else if (G.view === 'play') showView('shop'); else showView('play'); return; }
    if (G.view !== 'play' || G.modal) return;
    if (e.target && e.target.tagName === 'BUTTON' && e.code === 'Space' && e.target.id !== 'act') e.target.blur();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) { KEYS[e.code] = true; applyMove(); return; }
    if (e.code === 'Space') { if (!spaceDown && !e.repeat) { spaceDown = true; pressDown(); } }
    else if (e.key >= '1' && e.key <= '4') useSkill(ACTIVE_SKILLS[+e.key - 1].id);
    else if (e.code === 'KeyE') talkNpc();
    else if (e.code === 'KeyB') cycleBait();
    else if (e.code === 'KeyM') showView('map');
    else if (e.code === 'KeyF') toggleFullscreen();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') { spaceDown = false; pressUp(); }
    if (KEYS[e.code]) { KEYS[e.code] = false; applyMove(); }
  });
  window.addEventListener('hashchange', routeFromHash);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveNow(); pressUp(); } });
}

  const t = $('eTitle'); if (t) t.textContent = d.name;
  buildAmbient(); saveSoon();
  showMsg(ok ? 'Đã lưu. Cá này sẽ xuất hiện trong game ở ' + (LAKES.find(l => l.id === d.lake) || {}).name + '.' : 'Đã áp dụng nhưng trình duyệt không lưu được, hãy dùng Xuất gói cá.', ok ? '' : 'warn');
  const th = $('curImg'); if (th) th.src = spriteURL(d.id);
}
let removeArm = 0;
async function removeFish(btn) {
  if (!removeArm) { removeArm = 1; btn.textContent = 'Bấm lần nữa để xác nhận'; setTimeout(() => { removeArm = 0; const b = $('rmBtn'); if (b) b.textContent = A.draft && !A.draft.custom ? 'Khôi phục mặc định' : 'Xoá loài'; }, 3500); return; }
  removeArm = 0; const id = A.sel; await DB.del(id); await rebuildFish(); buildAmbient();
  A.sel = null; A.draft = null; const next = fishById(id) || FISH[0]; refreshTop(); selectFish(next ? next.id : null);
}

/* ---------- xuất, nhập ---------- */
async function doExport(full) {
  const recs = (await DB.all()).map(r => { const o = Object.assign({}, r); if (!full) { delete o.src; delete o.mask; } return o; });
  const text = JSON.stringify({ app: 'caucapixel', v: 1, fish: recs });
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  const area = $('expArea');
  if (dl) { try { await dl.save({ filename: 'goi-ca-pixel.json', data: text }); area.innerHTML = '<div class="note">Đã gửi yêu cầu lưu file goi-ca-pixel.json (' + recs.length + ' loài đã chỉnh).</div>'; return; } catch (e) { /* rơi xuống sao chép */ } }
  A.exportText = text;
  area.innerHTML = '<div class="note">Gói gồm ' + recs.length + ' loài đã chỉnh. Sao chép đoạn này, dán vào file .json để giữ, rồi dùng Nhập gói cá để nạp lại.</div><textarea class="exp" id="expText" readonly></textarea><div class="row" style="margin-top:6px"><button class="btn" type="button" data-a="copyExp">Sao chép</button></div>';
  $('expText').value = text;
}
async function doImportText(text) {
  try {
    const o = JSON.parse(text); if (!o || !Array.isArray(o.fish)) throw new Error('bad');
    let n = 0; for (const r of o.fish) { if (r && r.id && r.name) { await DB.put(r); n++; } }
    await rebuildFish(); buildAmbient(); refreshTop(); refreshList(); A.sel = null; A.draft = null; selectFish((FISH[0] || {}).id);
    $('expArea').innerHTML = '<div class="note">Đã nhập ' + n + ' loài.</div>';
  } catch (e) { $('expArea').innerHTML = '<div class="note warn">File này không phải gói cá hợp lệ.</div>'; }
}

/* ---------- sự kiện ---------- */
function onAdminClick(e) {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a;
  if (a === 'pick') { readForm(); selectFish(t.dataset.id); }
  else if (a === 'new') { readForm(); const d = DRAFT_NEW(A.lakeFilter !== 'all' ? A.lakeFilter : S.lake); selectFish(d.id, d); }
  else if (a === 'choose') $('oneFile').click();
  else if (a === 'bulk') $('bulkFile').click();
  else if (a === 'save') saveFish();
  else if (a === 'remove') removeFish(t);
  else if (a === 'tool') { A.tool = t.dataset.t; drawSrc(); drawCut(); }
  else if (a === 'anim') { if (t.dataset.s === 'flip') A.flip = !A.flip; else { A.animState = t.dataset.s; A.t0 = performance.now(); } }
  else if (a === 'export') doExport(false);
  else if (a === 'exportFull') doExport(true);
  else if (a === 'import') $('importFile').click();
  else if (a === 'copyExp') { const ta = $('expText'); ta.select(); let ok = false; try { navigator.clipboard.writeText(A.exportText).then(() => toast('Đã sao chép', 'good'), () => { document.execCommand && document.execCommand('copy'); }); ok = true; } catch (er) { /* chọn thủ công */ } if (!ok) { try { document.execCommand('copy'); } catch (er) { /* bỏ */ } } }
}
function onAdminChange(e) {
  const t = e.target;
  if (t.id === 'lakeFilter') { A.lakeFilter = t.value; refreshList(); return; }
  if (t.id === 'oneFile' && t.files && t.files[0]) { handleFiles([t.files[0]], false); t.value = ''; return; }
  if (t.id === 'bulkFile' && t.files && t.files.length) { bulkUpload([...t.files]); t.value = ''; return; }
  if (t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => doImportText(String(r.result)); r.readAsText(t.files[0]); t.value = ''; return; }
  if (t.dataset && t.dataset.p) setParam(t);
}
function onAdminInput(e) {
  const t = e.target;
  if (t.dataset && t.dataset.p && t.type === 'range') setParam(t);
  else if (t.dataset && t.dataset.brush) A.brush = +t.value;
  else if (t.id === 'f_name') { const h = $('eTitle'); if (h) h.textContent = t.value || 'Loài mới'; }
}
function setParam(t) {
  const k = t.dataset.p; let v = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : (t.tagName === 'SELECT' && k === 'width' ? +t.value : t.value);
  A.params[k] = v; const lbl = $('v_' + k); if (lbl) lbl.textContent = v;
  if (!A.src) return;
  if (k === 'tol' || k === 'erode' || k === 'bgMode') later('m', () => recompute(true), 120); else later('s', () => recompute(false), 60);
}
/* cọ tô và chọn màu nền */
(function () {
  let painting = false;
  const pos = (cv, e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const paint = e => {
    const cv = $('cutCv'); if (!cv || !A.mask) return; const p = pos(cv, e), r = A.brush, v = A.tool === 'restore' ? 1 : 0;
    for (let y = Math.max(0, Math.floor(p.y - r)); y <= Math.min(A.H - 1, Math.ceil(p.y + r)); y++) for (let x = Math.max(0, Math.floor(p.x - r)); x <= Math.min(A.W - 1, Math.ceil(p.x + r)); x++) if ((x - p.x) * (x - p.x) + (y - p.y) * (y - p.y) <= r * r) A.mask[y * A.W + x] = v;
    drawCut();
  };
  document.addEventListener('pointerdown', e => {
    if (e.target.id === 'cutCv' && (A.tool === 'erase' || A.tool === 'restore')) { painting = true; e.target.setPointerCapture(e.pointerId); paint(e); e.preventDefault(); }
    else if (e.target.id === 'srcCv' && A.tool === 'pick') { const p = pos(e.target, e), i = (Math.min(A.H - 1, Math.floor(p.y)) * A.W + Math.min(A.W - 1, Math.floor(p.x))) * 4; A.bg = [A.sd.data[i], A.sd.data[i + 1], A.sd.data[i + 2]]; A.params.bgMode = 'color'; A.tool = 'none'; const s = document.querySelector('[data-p="bgMode"]'); if (s) s.value = 'color'; recompute(true); drawSrc(); }
  });
  document.addEventListener('pointermove', e => { if (painting) paint(e); });
  const end = () => { if (painting) { painting = false; recompute(false); } };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();

/* ---------- xem thử chuyển động ---------- */
function curSprite() {
  const d = A.draft; if (!d) return null;
  if (A.res) return { canvas: A.res.canvas };
  return SPR[d.id] ? { canvas: SPR[d.id].canvas } : null;
}
function startAnim() {
  if (A.raf) return;
  const loop = ts => {
    A.raf = requestAnimationFrame(loop);
    if (G.view !== 'admin') return;
    const c = $('animCv'); if (!c) return;
    const s = curSprite(); const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    for (let y = 0; y < 150; y += 5) { x.fillStyle = rgbStr(mixRgb([60, 150, 150], [20, 70, 100], y / 150)); x.fillRect(0, y, 320, 5); }
    x.fillStyle = 'rgba(255,255,255,.4)'; x.fillRect(0, 10, 320, 1);
    if (!s) return;
    const t = ts / 1000, W = s.canvas.width, st = A.animState; let cx = 160, cy = 80, o;
    const dir = A.flip ? -1 : 1;
    if (st === 'swim') { cx = 160 + Math.sin(t * 0.8) * 70; const mv = Math.cos(t * 0.8) * dir > 0; o = { flip: A.flip ? !mv : mv ? false : true, amp: 2.5, phase: t * 7, freq: 1.0 }; o.flip = Math.cos(t * 0.8) < 0; if (A.flip) o.flip = !o.flip; cy = 75 + Math.sin(t * 1.3) * 8; }
    else if (st === 'bite') { const k = ((ts - A.t0) / 1000) % 2.2; const lunge = k < 0.35 ? k / 0.35 : k < 0.7 ? 1 - (k - 0.35) / 0.35 * 1.2 : 0; cx = 190 - lunge * 40 * dir; cy = 80; o = { flip: !A.flip, amp: 2 + lunge * 4, phase: t * 10, freq: 1.0 }; x.fillStyle = '#e04a3a'; x.fillRect(120, 10, 3, 6); x.fillStyle = '#fff'; x.fillRect(120, 16, 3, 5); x.fillStyle = '#e9f1f2'; x.fillRect(121, 21, 1, 54); }
    else { cx = 160 + Math.sin(t * 9) * 5; cy = 80 + Math.sin(t * 6) * 4; o = { flip: !A.flip, amp: 7, phase: t * 20, tilt: Math.sin(t * 13) * 0.28, freq: 1.0 }; }
    drawFishWavy(x, s.canvas, cx, cy, o);
  };
  A.raf = requestAnimationFrame(loop);
}

  resizeStage(); initWorld(); bindInput(); buildSkillBar();

}
document.addEventListener('click', e => { const t = e.target.closest('[data-act="help"]'); if (t) { closeModal(); showHelp(); } });
window.__fishgame = { AUD, G, mapOf, castPoint, walkable, isWater, spawnNpc, talkNpc, initWorld, get S() { return S; }, FISH: () => FISH, SPR, pickFish, setHook, landFish, startFight: setHook, useSkill, travel, showView, saveNow };
boot().catch(err => { console.error(err); const m = document.createElement('p'); m.className = 'panel'; m.textContent = 'Không khởi động được: ' + err.message; document.body.appendChild(m); });

})();
